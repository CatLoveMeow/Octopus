<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1240px;margin:auto;padding:28px clamp(16px,4vw,44px) 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 24px Georgia,serif}.brand h1{font:700 30px/1 Georgia,serif;letter-spacing:-1px;margin:0}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions,.row{display:flex;align-items:center;gap:10px}.btn{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:10px 14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}.btn.subtle{background:var(--soft);border-color:transparent}.btn.icon{width:42px;padding:0;font-size:19px}.hidden{display:none!important}.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr);gap:18px;margin-bottom:30px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.continue{padding:24px;display:flex;gap:20px;align-items:center;min-height:205px}.cover{aspect-ratio:2/3;width:106px;flex:none;display:grid;place-items:center;text-align:center;padding:12px;color:#fff;font:700 25px Georgia,serif;background:linear-gradient(145deg,#587d68,#253f34);border-radius:8px;overflow:hidden;object-fit:cover}.continue .cover{width:105px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:750}.continue h2{font:700 25px/1.2 Georgia,serif;margin:8px 0}.muted{color:var(--muted)}.small{font-size:13px}.progress{height:5px;background:var(--line);border-radius:20px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:var(--accent);border-radius:20px}.summary{padding:24px;display:flex;flex-direction:column;justify-content:center;gap:14px}.stat{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.stat strong{font:700 27px Georgia,serif}.toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center}.search{flex:1;position:relative}.field{width:100%;min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 16px}.section-head h2{font:700 25px Georgia,serif;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 18px}.book{position:relative;min-width:0}.book-open{border:0;background:transparent;color:inherit;text-align:left;width:100%;padding:0;border-radius:12px}.book-open:focus-visible{outline-offset:4px}.book .cover{width:100%;border-radius:10px;box-shadow:0 7px 18px #00000012;transition:transform .15s}.book-open:hover .cover{transform:translateY(-3px)}.book-title{font-weight:700;line-height:1.3;margin-top:10px;overflow-wrap:anywhere}.book-sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book-progress{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}.book-menu{position:absolute;right:5px;top:5px;border:0;border-radius:50%;background:#171a18b8;color:white;width:34px;height:34px}.empty{padding:50px 20px;text-align:center}.empty h2{font:700 25px Georgia,serif;margin:0 0 8px}.empty p{max-width:420px;margin:0 auto 18px;color:var(--muted)}.reader-top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px max(16px,calc((100vw - 920px)/2));display:flex;align-items:center;gap:8px}.reader-title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;font-size:14px}.reader-progress{height:3px;background:var(--line)}.reader-progress i{display:block;height:100%;background:var(--accent);width:0}.reader{max-width:var(--reader-width);margin:44px auto 120px;padding:0 24px;font:var(--reader-size)/var(--reader-line) var(--reader-font);overflow-wrap:break-word}.reader h2{font:700 1.5em/1.25 system-ui,sans-serif;margin:0 0 1.6em;letter-spacing:-.03em}.reader p{margin:0 0 1.15em;white-space:normal;overflow-wrap:normal;word-break:normal;hyphens:auto}.reader p:first-of-type{margin-top:0}.reader p mark{background:#f7df88;color:#28261e;border-radius:3px;padding:0 2px}.reader-footer{max-width:var(--reader-width);margin:0 auto 50px;padding:0 24px;display:flex;justify-content:space-between;gap:10px}.reader-controls{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:5px;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px #0002;max-width:calc(100vw - 20px)}.reader-controls .btn{border:0;background:transparent;min-width:40px;padding:7px}.reader-controls .position{min-width:76px;text-align:center;font-size:12px;color:var(--muted)}.reader-controls .active{background:var(--soft)}.page{max-width:820px;margin:0 auto;padding:10px 0}.back{margin-bottom:20px}.detail{display:flex;gap:24px;padding:24px;margin-bottom:25px}.detail .cover{width:150px}.detail h2{font:700 clamp(26px,4vw,40px)/1.1 Georgia,serif;margin:4px 0 8px;overflow-wrap:anywhere}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.chapter-list{overflow:hidden}.chapter-row{display:flex;width:100%;text-align:left;justify-content:space-between;gap:10px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text)}.chapter-row:last-child{border-bottom:0}.chapter-row:hover,.chapter-row.current{background:var(--soft)}.chapter-row small{color:var(--muted)}.overlay{position:fixed;inset:0;background:#0008;z-index:20;display:flex;justify-content:flex-end}.drawer{width:min(420px,100%);height:100%;overflow:auto;background:var(--panel);padding:22px;border-left:1px solid var(--line)}.drawer h2{font:700 25px Georgia,serif;margin:0 0 20px}.setting{margin:18px 0}.setting label{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:7px}.setting input[type=range]{width:100%;accent-color:var(--accent)}.seg{display:flex;gap:7px;flex-wrap:wrap}.seg button{flex:1}.toast{position:fixed;z-index:30;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;max-width:calc(100vw - 24px);box-shadow:var(--shadow)}.drop{border:2px dashed var(--line);border-radius:18px;padding:30px;text-align:center}.drop.drag{border-color:var(--accent);background:var(--soft)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-label{display:block;font-size:13px;font-weight:650;margin:0 0 6px}.notice{padding:12px 14px;border-radius:12px;background:var(--soft);font-size:13px;color:var(--muted);margin:14px 0}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin:32px 0}.chapter-search{margin-bottom:12px}
@media(max-width:700px){.app{padding-top:20px}.hero{grid-template-columns:1fr}.summary{padding:18px}.continue{padding:18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}.cover{font-size:20px}.book-title{font-size:14px}.book-sub{font-size:12px}.top{align-items:flex-start}.brand h1{font-size:27px}.top .actions .label{display:none}.reader{margin-top:30px;padding:0 22px}.reader-top{padding:8px}.detail{flex-direction:column;align-items:flex-start}.detail .cover{width:120px}.reader-controls{gap:0}.reader-controls .btn{min-width:36px;padding:6px}.reader-controls .position{min-width:64px}.two{grid-template-columns:1fr}}
@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.continue .cover{width:82px}.continue{gap:14px}.continue h2{font-size:21px}}

<body>
<div id="root"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<input id="file-input" type="file" accept=".txt,.md,.text,.pdf,.epub,.json" multiple hidden>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const DB_NAME='shelf-db', DB_VERSION=1;
let db, books=[], currentBook=null, chapters=[], chapterIndex=0, view='home', search='', sort='recent', activeSpeech=null, speechParagraph=0, speechRate=1, settings={theme:'light',fontSize:21,lineHeight:1.85,width:720,font:'Serif',align:'left'};
const root=$('#root'), fileInput=$('#file-input');
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeText(v){return String(v??'').replace(/\u0000/g,'').trim();}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3200);}
function id(){return 'b_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('books'))d.createObjectStore('books',{keyPath:'id'});if(!d.objectStoreNames.contains('chapters')){const s=d.createObjectStore('chapters',{keyPath:'key'});s.createIndex('bookId','bookId',{unique:false});}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function reqPromise(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function getAll(store){return reqPromise(db.transaction(store,'readonly').objectStore(store).getAll());}
async function put(store,val){return reqPromise(db.transaction(store,'readwrite').objectStore(store).put(val));}
async function get(store,key){return reqPromise(db.transaction(store,'readonly').objectStore(store).get(key));}
async function removeBook(bookId){return new Promise((resolve,reject)=>{const tx=db.transaction(['books','chapters'],'readwrite');tx.objectStore('books').delete(bookId);const s=tx.objectStore('chapters'),idx=s.index('bookId'),req=idx.openCursor(IDBKeyRange.only(bookId));req.onsuccess=()=>{const c=req.result;if(c){c.delete();c.continue();}};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function loadState(){books=(await getAll('books')).sort((a,b)=>(b.lastRead||b.added)-(a.lastRead||a.added));const saved=await get('settings','main');if(saved?.value)settings={...settings,...saved.value};applySettings();}
function applySettings(){document.documentElement.dataset.theme=settings.theme;document.documentElement.style.setProperty('--reader-size',settings.fontSize+'px');document.documentElement.style.setProperty('--reader-line',settings.lineHeight);document.documentElement.style.setProperty('--reader-width',settings.width+'px');document.documentElement.style.setProperty('--reader-font',settings.font==='Serif'?'Georgia,serif':settings.font==='Sans'?'system-ui,sans-serif':'ui-monospace,monospace');}
async function saveSettings(){await put('settings',{key:'main',value:settings});applySettings();}
function coverHTML(b,cls='cover'){const color=b.color||'#496b56';return b.cover?`<img class="${cls}" src="${esc(b.cover)}" alt="" loading="lazy">`:`<div class="${cls}" style="background:linear-gradient(145deg,${color},#202c26)">${esc((b.title||'?').trim().slice(0,1).toUpperCase())}</div>`;}
function pct(b){return Math.max(0,Math.min(100,Math.round(b.progress||0)));}
function calcProgress(b,ch){const total=b.totalWords||0;if(!total)return 0;const done=(b.chapterWordsDone||0)+(ch?.wordCount||0)*(b.position||0);return Math.round(Math.min(1,done/total)*100);}
function renderHome(){view='home';currentBook=null;const list=books.filter(b=>(b.title+' '+(b.author||'')).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='progress'?pct(b)-pct(a):sort==='added'?b.added-a.added:(b.lastRead||b.added)-(a.lastRead||a.added));const recent=books.filter(b=>b.lastRead).sort((a,b)=>b.lastRead-a.lastRead)[0];root.innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="mark">S</div><div><h1>Shelf</h1><p>A quieter place to read.</p></div></div><div class="actions"><button class="btn" data-action="backup">↥ <span class="label">Back up</span></button><button class="btn icon" data-action="settings" aria-label="Settings">⚙</button></div></header>
${recent?`<section class="hero"><div class="panel continue">${coverHTML(recent)}<div style="min-width:0;flex:1"><div class="eyebrow">Pick up where you left off</div><h2>${esc(recent.title)}</h2><div class="muted small">${esc(recent.author||'Unknown author')} · Chapter ${(recent.chapterIndex||0)+1}</div><div class="progress"><i style="width:${pct(recent)}%"></i></div><div class="muted small">${pct(recent)}% through this book</div><button class="btn primary" style="margin-top:14px" data-action="open" data-id="${recent.id}">Continue reading →</button></div></div><div class="panel summary"><div class="eyebrow">Your reading space</div><div class="stat"><span class="muted">Books on your shelf</span><strong>${books.length}</strong></div><div class="stat"><span class="muted">Finished</span><strong>${books.filter(b=>b.finished).length}</strong></div><div class="stat"><span class="muted">Stored on this device</span><strong>Local</strong></div><div class="small muted">Your books stay in this browser unless you export a backup.</div></div></section>`:''}
<div class="toolbar"><div class="search"><input id="search" class="field" type="search" placeholder="Search titles and authors…" value="${esc(search)}" aria-label="Search your library"></div><select id="sort" class="field" style="width:auto;max-width:165px" aria-label="Sort library"><option value="recent" ${sort==='recent'?'selected':''}>Recently read</option><option value="added" ${sort==='added'?'selected':''}>Recently added</option><option value="title" ${sort==='title'?'selected':''}>Title A–Z</option><option value="progress" ${sort==='progress'?'selected':''}>Progress</option></select><button class="btn primary" data-action="import">＋ <span class="label">Import</span></button></div>
<div class="section-head"><h2>Your library</h2><span class="muted small">${list.length} ${list.length===1?'book':'books'}</span></div>
${list.length?`<section class="grid">${list.map(b=>`<article class="book"><button class="book-open" data-action="detail" data-id="${b.id}" aria-label="Open ${esc(b.title)}">${coverHTML(b)}<div class="book-title">${esc(b.title)}</div><div class="book-sub">${esc(b.author||'Unknown author')}</div><div class="book-progress"><span>${b.finished?'Finished':b.chapterCount+' chapters'}</span><span>${pct(b)}%</span></div><div class="progress"><i style="width:${pct(b)}%"></i></div></button><button class="book-menu" data-action="menu" data-id="${b.id}" aria-label="Book actions for ${esc(b.title)}">⋯</button></article>`).join('')}</section>`:`<section class="panel empty"><h2>${books.length?'No matching books yet':'Make this space yours.'}</h2><p>${books.length?'Try a different title or author.':'Import an EPUB, PDF, TXT or Markdown file. Your library is stored locally in this browser.'}</p><button class="btn primary" data-action="import">＋ Import your first book</button><p class="small" style="margin-top:14px">Shelf stores books in this browser. Export a backup before clearing browser data.</p></section>`}
<div class="footer-note">Shelf · Private by design · Stored on this device</div></main>`;
$('#search').addEventListener('input',e=>{search=e.target.value;const p=e.target.selectionStart;renderHome();const el=$('#search');el.focus();el.setSelectionRange(p,p)});$('#sort').onchange=e=>{sort=e.target.value;renderHome();};}
function renderDetail(b){view='detail';currentBook=b;root.innerHTML=`<main class="app"><button class="btn back" data-action="home">← Library</button><section class="panel detail">${coverHTML(b)}<div style="flex:1;min-width:0"><div class="eyebrow">Book details</div><h2>${esc(b.title)}</h2><p class="muted">${esc(b.author||'Unknown author')}</p><p class="muted small">${b.chapterCount} chapters · ${(b.totalWords||0).toLocaleString()} words · ${pct(b)}% read</p><div class="progress"><i style="width:${pct(b)}%"></i></div><div class="detail-actions"><button class="btn primary" data-action="open" data-id="${b.id}">${b.lastRead?'Continue reading':'Start reading'} →</button><button class="btn" data-action="rename" data-id="${b.id}">Edit details</button><button class="btn" data-action="export-book" data-id="${b.id}">Export book</button><button class="btn" data-action="delete" data-id="${b.id}">Remove</button><button class="btn" data-action="finish" data-id="${b.id}">${b.finished?'Mark unfinished':'Mark finished'}</button></div></div></section><div class="section-head"><h2>Chapters</h2><span class="muted small">${b.chapterCount} total</span></div><input class="field chapter-search" id="chapter-search" placeholder="Find a chapter…" aria-label="Search chapters"><section class="panel chapter-list">${(awaitGetChaptersCache[b.id]||[]).map((c,i)=>`<button class="chapter-row ${i===b.chapterIndex?'current':''}" data-action="open-chapter" data-id="${b.id}" data-chapter="${i}"><span>${esc(c.title)}</span><small>${i===b.chapterIndex?'Last position':`${(c.wordCount||0).toLocaleString()} words`}</small></button>`).join('')}</section></main>`;
$('#chapter-search').oninput=e=>$$('.chapter-row').forEach(r=>r.classList.toggle('hidden',!r.textContent.toLowerCase().includes(e.target.value.toLowerCase())));}
const awaitGetChaptersCache={};
async function detail(id){const b=books.find(x=>x.id===id);if(!b)return;await loadChapters(id);renderDetail(b);}
async function loadChapters(bookId){const all=await getAll('chapters');awaitGetChaptersCache[bookId]=all.filter(c=>c.bookId===bookId).sort((a,b)=>a.index-b.index).map(c=>c.data);}
function normalizeImportedText(text){
  return String(text||'')
    .replace(/\r\n?/g,'\n')
    .replace(/\u0000/g,'')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n[ \t]+/g,'\n')
    .trim();
}
function splitText(text){
  const clean=normalizeImportedText(text);
  if(!clean)return[];
  // Detect explicit chapter headings only when there are multiple credible headings.
  const lines=clean.split('\n');
  const heading=/^\s*(chapter|book|part|prologue|epilogue|interlude|preface)\s+[\wIVXLC0-9:.-]+.*$/i;
  const starts=[];
  for(let i=0;i<lines.length;i++) if(heading.test(lines[i].trim())&&lines[i].trim().length<120) starts.push(i);
  if(starts.length>=2){
    const out=[];
    for(let k=0;k<starts.length;k++){
      const from=starts[k],to=starts[k+1]??lines.length;
      const body=lines.slice(from,to).join('\n').trim();
      if(body.length>25)out.push({title:lines[from].trim(),text:reflowParagraphs(body)});
    }
    if(out.length>=2)return out;
  }
  // Blank lines are treated as paragraph boundaries; single line wraps are reflowed.
  const reflowed=reflowParagraphs(clean);
  const paragraphs=reflowed.split(/\n\s*\n/);
  const out=[];let batch=[],words=0,n=1;
  for(const paragraph of paragraphs){
    const wc=paragraph.split(/\s+/).filter(Boolean).length;
    if(batch.length&&words+wc>2200){
      out.push({title:`Part ${n++}`,text:batch.join('\n\n')});batch=[];words=0;
    }
    batch.push(paragraph);words+=wc;
  }
  if(batch.length)out.push({title:out.length?`Part ${n}`:'Text',text:batch.join('\n\n')});
  return out;
}
function reflowParagraphs(text){
  // Merge single newlines (common in TXT/PDF line wrapping), keep blank lines as paragraphs.
  return normalizeImportedText(text).split(/\n\s*\n/).map(block=>
    block.split('\n').map(line=>line.trim()).filter(Boolean).join(' ')
  ).filter(Boolean).join('\n\n');
}
function wordCount(text){return (text.match(/\b[\p{L}\p{N}'’-]+\b/gu)||[]).length;}
async function addBook({title,author='',cover='',chapters:ch,sourceName=''}){if(!ch?.length){toast('No readable text found in that file.');return;}const bookId=id(),totalWords=ch.reduce((n,c)=>n+wordCount(c.text),0),b={id:bookId,title:safeText(title)||'Untitled',author:safeText(author)||'Unknown author',cover:'',color:['#496b56','#52647d','#88684e','#765f83','#477b7c'][Math.floor(Math.random()*5)],sourceName,added:Date.now(),lastRead:0,chapterIndex:0,position:0,progress:0,totalWords,chapterCount:ch.length,finished:false};const tx=db.transaction(['books','chapters'],'readwrite');tx.objectStore('books').put(b);ch.forEach((c,i)=>tx.objectStore('chapters').put({key:bookId+'_'+i,bookId,index:i,data:{title:safeText(c.title)||`Chapter ${i+1}`,text:c.text,wordCount:wordCount(c.text)}}));await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});books.unshift(b);toast('Added “'+b.title+'”');renderHome();}
async function importFiles(files){for(const f of files){try{const ext=f.name.split('.').pop().toLowerCase();if(ext==='json'){await restoreBackup(await f.text());continue;}let ch,title=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),author='';if(['txt','md','text'].includes(ext)){ch=splitText(await f.text());}else if(ext==='pdf'){if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let pageTexts=[];for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),tc=await page.getTextContent();let lines=[],line='',lastY=null;for(const item of tc.items){const y=item.transform?.[5]??null;if(lastY!==null&&y!==null&&Math.abs(y-lastY)>2){if(line.trim())lines.push(line.trim());line='';}line+=(line?' ':'')+item.str;lastY=y;}if(line.trim())lines.push(line.trim());const pageText=lines.join('\n');if(pageText.trim())pageTexts.push(pageText);if(i%10===0)toast(`Reading PDF: page ${i} of ${pdf.numPages}`);}const allText=reflowParagraphs(pageTexts.join('\n\n'));ch=splitText(allText);if(!ch.length)throw Error('No selectable text found. This may be a scanned PDF.');}else if(ext==='epub'){if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');ch=await parseEpub(await f.arrayBuffer());}else throw Error('Supported formats: EPUB, PDF, TXT, Markdown, and Shelf backup JSON.');await addBook({title,author,chapters:ch,sourceName:f.name});}catch(err){console.error(err);toast(f.name+': '+(err.message||'Import failed'));}}}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=()=>reject(new Error('Could not load import library. Check your connection and retry.'));document.head.append(s);});}
async function parseEpub(buf){const zip=await JSZip.loadAsync(buf),parser=new DOMParser();const read=async p=>{const f=zip.file(p);return f?f.async('string'):'';};const xml=t=>parser.parseFromString(t,'application/xml');const container=xml(await read('META-INF/container.xml'));const rootfile=container.querySelector('rootfile')?.getAttribute('full-path');if(!rootfile)throw Error('EPUB package file was not found.');const opf=xml(await read(rootfile)),base=rootfile.slice(0,rootfile.lastIndexOf('/')+1),manifest=new Map();opf.querySelectorAll('manifest item').forEach(i=>manifest.set(i.getAttribute('id'),i));const spine=[...opf.querySelectorAll('spine itemref')];const out=[];for(const ref of spine){const item=manifest.get(ref.getAttribute('idref'));if(!item)continue;const href=decodeURIComponent(item.getAttribute('href')||'').split('#')[0];const path=normalizePath(base+href);const raw=await read(path);if(!raw)continue;const doc=parser.parseFromString(raw,'text/html');doc.querySelectorAll('script,style,nav,svg,iframe,object').forEach(n=>n.remove());const title=doc.querySelector('h1,h2,h3')?.textContent?.trim()||`Chapter ${out.length+1}`;const paragraphs=[...doc.querySelectorAll('h1,h2,h3,h4,p,blockquote,li')].map(n=>n.textContent.replace(/\s+/g,' ').trim()).filter(Boolean);const text=paragraphs.join('\n\n');if(text.length>30)out.push({title,text});}if(!out.length)throw Error('No readable EPUB chapters found.');return out;}
function normalizePath(path){const a=[];for(const p of path.split('/')){if(p==='..')a.pop();else if(p&&p!=='.')a.push(p);}return a.join('/');}
async function openBook(bookId,index){const b=books.find(x=>x.id===bookId);if(!b)return;await loadChapters(bookId);chapters=awaitGetChaptersCache[bookId]||[];if(!chapters.length){toast('This book has no stored chapters.');return;}currentBook=b;chapterIndex=Math.max(0,Math.min(chapters.length-1,index??b.chapterIndex??0));view='reader';stopSpeech();b.lastRead=Date.now();b.finished=false;await put('books',b);renderReader();}
function renderReader(){const c=chapters[chapterIndex];if(!c)return;const b=currentBook;root.innerHTML=`<div class="reader-top"><button class="btn icon" data-action="home" aria-label="Back to library">←</button><div class="reader-title">${esc(b.title)} · ${esc(c.title)}</div><button class="btn icon" data-action="toc" aria-label="Contents">☷</button><button class="btn icon" data-action="settings" aria-label="Reading settings">Aa</button></div><div class="reader-progress"><i id="read-progress"></i></div><article class="reader" id="reader"><h2>${esc(c.title)}</h2>${c.text.split(/\n\s*\n|\n/).filter(s=>s.trim()).map((p,i)=>`<p data-paragraph="${i}">${esc(p.trim())}</p>`).join('')}</article><div class="reader-footer"><button class="btn" data-action="prev" ${chapterIndex===0?'disabled':''}>← Previous</button><button class="btn primary" data-action="next" ${chapterIndex>=chapters.length-1?'disabled':''}>Next chapter →</button></div><nav class="reader-controls" aria-label="Reader controls"><button class="btn" data-action="prev" aria-label="Previous chapter" ${chapterIndex===0?'disabled':''}>‹</button><button class="btn" data-action="toc" aria-label="Chapter list">☷</button><div class="position">Chapter ${chapterIndex+1}<br>${chapterIndex+1} / ${chapters.length}</div><button class="btn" data-action="bookmark" aria-label="Bookmark this chapter" class="${(b.bookmarks||[]).includes(chapterIndex)?'active':''}">▣</button><button class="btn" data-action="speech" aria-label="Read aloud">◖))</button><button class="btn" data-action="next" aria-label="Next chapter" ${chapterIndex>=chapters.length-1?'disabled':''}>›</button></nav>`;
const el=$('#reader');const saved=chapterIndex===(b.chapterIndex||0)?b.anchor:null;if(saved){const target=$(`[data-paragraph="${saved.paragraph||0}"]`,el);target?.scrollIntoView({block:'start'});}else window.scrollTo(0,0);const update=()=>{const rect=el.getBoundingClientRect(),max=el.scrollHeight-innerHeight+Math.max(0,rect.top);const p=Math.max(0,Math.min(1,(-rect.top+80)/Math.max(1,el.scrollHeight-innerHeight)));$('#read-progress').style.width=(p*100)+'%';const ps=$$('p[data-paragraph]',el);let nearest=0;for(let i=0;i<ps.length;i++){if(ps[i].getBoundingClientRect().top<innerHeight*.35)nearest=i;}b.anchor={paragraph:nearest,ratio:p};b.chapterIndex=chapterIndex;b.position=p;b.chapterWordsDone=chapters.slice(0,chapterIndex).reduce((n,x)=>n+x.wordCount,0);b.progress=calcProgress(b,c);put('books',b).then(()=>{const ix=books.findIndex(x=>x.id===b.id);if(ix>=0)books[ix]=b;});};window.onscroll=throttle(update,250);requestAnimationFrame(update);}
function throttle(fn,ms){let last=0,t;return()=>{const now=Date.now();if(now-last>=ms){last=now;fn();}else{clearTimeout(t);t=setTimeout(()=>{last=Date.now();fn();},ms-now+5);}};}
async function moveChapter(n){stopSpeech();const next=chapterIndex+n;if(next<0||next>=chapters.length)return;currentBook.chapterIndex=next;currentBook.anchor=null;await put('books',currentBook);chapterIndex=next;renderReader();window.scrollTo(0,0);}
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();activeSpeech=null;$$('[data-action=speech]').forEach(b=>b.classList.remove('active'));}
function speak(){if(!('speechSynthesis'in window)){toast('Text-to-speech is not supported in this browser.');return;}if(activeSpeech){stopSpeech();return;}const ps=$$('#reader p[data-paragraph]');let i=currentBook.anchor?.paragraph||0;activeSpeech=true;$$('[data-action=speech]').forEach(b=>b.classList.add('active'));function next(){if(!activeSpeech||i>=ps.length){stopSpeech();return;}const p=ps[i++];p.scrollIntoView({block:'center',behavior:'smooth'});const u=new SpeechSynthesisUtterance(p.textContent);u.rate=speechRate;u.onend=next;u.onerror=()=>stopSpeech();speechSynthesis.speak(u);}next();}
async function openDrawer(){const isReader=view==='reader';const wrap=document.createElement('div');wrap.className='overlay';wrap.id='overlay';wrap.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true" aria-label="${isReader?'Reading settings':'Settings'}"><div class="row" style="justify-content:space-between"><h2>${isReader?'Reading settings':'Shelf settings'}</h2><button class="btn icon" data-action="close-drawer" aria-label="Close settings">×</button></div><div class="setting"><label for="theme">Appearance</label><select class="field" id="theme"><option value="light">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select></div><div class="setting"><label for="font">Reading font</label><select class="field" id="font"><option>Serif</option><option>Sans</option><option>Mono</option></select></div><div class="setting"><label for="fontSize">Text size <span id="fs-label">${settings.fontSize}px</span></label><input id="fontSize" type="range" min="15" max="34" value="${settings.fontSize}"></div><div class="setting"><label for="lineHeight">Line spacing <span id="lh-label">${settings.lineHeight}</span></label><input id="lineHeight" type="range" min="1.35" max="2.4" step=".05" value="${settings.lineHeight}"></div><div class="setting"><label for="width">Reading width <span id="width-label">${settings.width}px</span></label><input id="width" type="range" min="420" max="1000" step="20" value="${settings.width}"></div><div class="setting"><label for="speechRate">Speech speed <span id="sr-label">${speechRate.toFixed(1)}×</span></label><input id="speechRate" type="range" min=".7" max="1.5" step=".1" value="${speechRate}"></div><div class="notice">Settings are saved locally in this browser. Book text is not uploaded by Shelf.</div><button class="btn" data-action="reset-settings">Reset reading settings</button></aside>`;document.body.append(wrap);$('#theme').value=settings.theme;$('#font').value=settings.font;$('#theme').onchange=async e=>{settings.theme=e.target.value;await saveSettings();};$('#font').onchange=async e=>{settings.font=e.target.value;await saveSettings();};$('#fontSize').oninput=async e=>{settings.fontSize=+e.target.value;$('#fs-label').textContent=settings.fontSize+'px';await saveSettings();};$('#lineHeight').oninput=async e=>{settings.lineHeight=+e.target.value;$('#lh-label').textContent=settings.lineHeight;await saveSettings();};$('#width').oninput=async e=>{settings.width=+e.target.value;$('#width-label').textContent=settings.width+'px';await saveSettings();};$('#speechRate').oninput=e=>{speechRate=+e.target.value;$('#sr-label').textContent=speechRate.toFixed(1)+'×';};wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove();});}
async function backup(){const allBooks=await getAll('books'),allChapters=await getAll('chapters'),savedSettings=await getAll('settings');const data={app:'Shelf',schema:1,createdAt:new Date().toISOString(),books:allBooks,chapters:allChapters,settings:savedSettings};downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'shelf-backup-'+new Date().toISOString().slice(0,10)+'.json');toast('Backup exported. Keep it somewhere safe.');}
async function restoreBackup(raw){const data=typeof raw==='string'?JSON.parse(raw):raw;if(data.app!=='Shelf'||!Array.isArray(data.books)||!Array.isArray(data.chapters))throw Error('This is not a valid Shelf backup.');if(!confirm(`Restore ${data.books.length} books? Existing books with matching IDs will be replaced.`))return;const tx=db.transaction(['books','chapters','settings'],'readwrite');for(const b of data.books)tx.objectStore('books').put(b);for(const c of data.chapters)tx.objectStore('chapters').put(c);for(const s of (data.settings||[]))tx.objectStore('settings').put(s);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});await loadState();renderHome();toast('Backup restored.');}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
async function exportBook(bookId){const b=books.find(x=>x.id===bookId);if(!b)return;await loadChapters(bookId);const ch=awaitGetChaptersCache[bookId];downloadBlob(new Blob([ch.map(c=>c.title+'\n\n'+c.text).join('\n\n')],{type:'text/plain;charset=utf-8'}),b.title.replace(/[^\p{L}\p{N}._-]+/gu,'_')+'.txt');}
async function renameBook(bookId){const b=books.find(x=>x.id===bookId);if(!b)return;const title=prompt('Book title:',b.title);if(title===null)return;const author=prompt('Author:',b.author||'');if(author===null)return;b.title=safeText(title)||'Untitled';b.author=safeText(author)||'Unknown author';await put('books',b);renderHome();toast('Book details updated.');}
async function handleAction(el){const a=el.dataset.action,id=el.dataset.id;try{if(a==='home'){stopSpeech();window.onscroll=null;renderHome();window.scrollTo(0,0);}else if(a==='import'){fileInput.accept='.txt,.md,.text,.pdf,.epub,.json';fileInput.click();}else if(a==='open')await openBook(id);else if(a==='detail')await detail(id);else if(a==='open-chapter')await openBook(id,+el.dataset.chapter);else if(a==='next')await moveChapter(1);else if(a==='prev')await moveChapter(-1);else if(a==='settings')await openDrawer();else if(a==='close-drawer')$('#overlay')?.remove();else if(a==='backup')await backup();else if(a==='toc'){if(!currentBook)return;const old=$('#overlay');old?.remove();const wrap=document.createElement('div');wrap.className='overlay';wrap.id='overlay';wrap.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true" aria-label="Chapters"><div class="row" style="justify-content:space-between"><h2>Chapters</h2><button class="btn icon" data-action="close-drawer">×</button></div><input class="field chapter-search" id="toc-search" placeholder="Find a chapter…">${chapters.map((c,i)=>`<button class="chapter-row ${i===chapterIndex?'current':''}" style="width:100%" data-action="toc-go" data-chapter="${i}"><span>${esc(c.title)}</span><small>${i+1}</small></button>`).join('')}</aside>`;document.body.append(wrap);$('#toc-search').oninput=e=>$$('.chapter-row',wrap).forEach(r=>r.classList.toggle('hidden',!r.textContent.toLowerCase().includes(e.target.value.toLowerCase())));wrap.onclick=e=>{if(e.target===wrap)wrap.remove();};}else if(a==='toc-go'){const target=+el.dataset.chapter;$('#overlay')?.remove();if(Number.isFinite(target)&&target>=0&&target<chapters.length){chapterIndex=target;currentBook.chapterIndex=target;currentBook.anchor=null;await put('books',currentBook);renderReader();window.scrollTo(0,0);}}else if(a==='bookmark'){const marks=currentBook.bookmarks||[];const ix=marks.indexOf(chapterIndex);ix<0?marks.push(chapterIndex):marks.splice(ix,1);currentBook.bookmarks=marks;await put('books',currentBook);renderReader();toast(ix<0?'Chapter bookmarked':'Bookmark removed');}else if(a==='speech')speak();else if(a==='menu'){const b=books.find(x=>x.id===id);if(!b)return;const choice=prompt(`Actions for "${b.title}"\nType: rename, export, delete, finish`);if(choice==='rename')await renameBook(id);else if(choice==='export')await exportBook(id);else if(choice==='delete')await deleteBook(id);else if(choice==='finish'){b.finished=!b.finished;await put('books',b);renderHome();}}else if(a==='rename')await renameBook(id);else if(a==='export-book')await exportBook(id);else if(a==='delete')await deleteBook(id);else if(a==='finish'){const b=books.find(x=>x.id===id);b.finished=!b.finished;await put('books',b);await detail(id);}}catch(err){console.error(err);toast(err.message||'Something went wrong.');}}
async function deleteBook(bookId){const b=books.find(x=>x.id===bookId);if(!b||!confirm(`Remove “${b.title}” and its reading data from this device? Export a backup first if you want to keep it.`))return;await removeBook(bookId);books=books.filter(x=>x.id!==bookId);toast('Book removed from this device.');renderHome();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handleAction(el);});
fileInput.addEventListener('change',async e=>{if(e.target.files?.length)await importFiles([...e.target.files]);fileInput.value='';});
const dropHandler=e=>{e.preventDefault();const target=$('.drop');target?.classList.remove('drag');if(e.dataTransfer.files?.length)importFiles([...e.dataTransfer.files]);};
document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files')){$('.drop')?.classList.add('drag');e.preventDefault();}});document.addEventListener('dragleave',e=>{if(!e.relatedTarget) $('.drop')?.classList.remove('drag');});document.addEventListener('drop',dropHandler);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay')?.remove();if(view==='reader'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight')moveChapter(1);if(e.key==='ArrowLeft')moveChapter(-1);if(e.key.toLowerCase()==='t')handleAction({dataset:{action:'toc'}});}});
async function init(){try{if(!('indexedDB'in window))throw Error('This browser does not support IndexedDB.');db=await openDB();await loadState();renderHome();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(err){root.innerHTML=`<main class="app"><section class="panel empty"><h2>Shelf could not start</h2><p>${esc(err.message)} Try a modern browser and open Shelf from a local web server or HTTPS website.</p></section></main>`;}}
init();
