<!DOCTYPE html>
<html lang="en" data-design="flat" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&family=Outfit:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#3B82F6;--fs:21px;--lh:1.8;--w:700px;--ta:left;--rail:76px;--fh:Outfit,system-ui,sans-serif;--fb:Outfit,system-ui,sans-serif;--rf:Fraunces,Georgia,serif;
--bg:#F4F5F7;--fg:#111827;--mu:#E5E7EB;--cd:#fff;--br:0px;--rad:14px;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);--dim:#6B7280;color-scheme:light}
[data-design=flat][data-mode=dark],[data-design=glass][data-mode=dark],[data-design=sketch][data-mode=dark]{--bg:#14161B;--fg:#ECEEF2;--mu:#262A33;--cd:#1D2027;--dim:#9AA1AE;--sh:0 8px 24px rgba(0,0,0,.4);color-scheme:dark}
[data-design=flat][data-mode=sepia],[data-design=glass][data-mode=sepia],[data-design=sketch][data-mode=sepia]{--bg:#F1E6D0;--fg:#3B2F20;--mu:#E0D2B6;--cd:#F8F0DF;--dim:#7B6A52}
[data-design=sketch]{--fh:Kalam,cursive;--fb:"Patrick Hand",cursive;--rf:"Patrick Hand",cursive;--bg:#fdfbf7;--fg:#2d2d2d;--mu:#e5e0d8;--cd:#fff;--br:3px;--rad:255px 15px 225px 15px/15px 225px 15px 255px;--sh:4px 4px 0 var(--fg);--dim:#6b6b6b}
[data-design=sketch][data-mode=dark]{--bg:#23211c;--fg:#f1ece0;--cd:#2e2b25;--mu:#3a372f}
[data-design=sketch][data-mode=sepia]{--bg:#f3e9d2;--fg:#3b2f20;--cd:#faf2df}
[data-design=retro]{--fh:"Arial Black",Impact,sans-serif;--fb:Tahoma,Verdana,sans-serif;--rf:Georgia,serif;--bg:#008080;--fg:#000;--mu:#808080;--cd:#c0c0c0;--br:2px;--rad:0;--sh:inset -1px -1px #404040,inset 1px 1px #fff;--dim:#404040;--ac:#000080}
[data-design=glass]{--fh:"Space Grotesk",sans-serif;--fb:"Space Grotesk",sans-serif;--rad:20px;--bg:#E8ECFF;--cd:rgba(255,255,255,.55);--mu:rgba(120,130,170,.18)}
[data-design=glass][data-mode=dark]{--cd:rgba(255,255,255,.07);--mu:rgba(255,255,255,.1)}
[data-design=glass][data-mode=sepia]{--cd:rgba(255,248,230,.6)}
[data-design=neon]{--fh:"Space Grotesk",sans-serif;--fb:"Space Grotesk",sans-serif;--rf:"Space Grotesk",sans-serif;--bg:#07070C;--fg:#E8F0FF;--mu:#1A1B2A;--cd:#0E0F18;--br:1px;--rad:6px;--dim:#8089A8;--sh:0 0 18px color-mix(in srgb,var(--ac) 35%,transparent);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 var(--fb);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
[data-design=glass] body{background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,var(--ac) 45%,transparent),transparent),radial-gradient(700px 500px at 100% 10%,#c084fc66,transparent),var(--bg);background-attachment:fixed}
[data-design=neon] body{background:radial-gradient(800px 400px at 50% -10%,color-mix(in srgb,var(--ac) 22%,transparent),transparent),var(--bg)}
h1,h2,h3{font-family:var(--fh);margin:0;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.hid{display:none!important}

[data-design=retro] .card{border-color:#fff #404040 #404040 #fff}
.btn{min-height:44px;padding:0 18px;border-radius:var(--rad);background:var(--ac);color:#fff;font-weight:600;border:var(--br) solid var(--fg);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}.btn.sec{background:var(--mu);color:var(--fg)}
[data-design=sketch] .btn{box-shadow:3px 3px 0 var(--fg)}[data-design=flat] .btn,[data-design=glass] .btn{border:0}
[data-design=retro] .btn{background:#c0c0c0;color:#000;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080;font-family:var(--fb)}
[data-design=neon] .btn{background:transparent;color:var(--ac);border-color:var(--ac);box-shadow:var(--sh)}
.ib{width:44px;height:44px;border-radius:var(--rad);display:grid;place-items:center;font-size:20px;flex:none}.ib:hover{background:var(--mu)}
.ib.on{background:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.fld{width:100%;height:46px;padding:0 14px;background:var(--cd);border:var(--br) solid var(--mu);border:max(1px,var(--br)) solid color-mix(in srgb,var(--fg) 22%,transparent);border-radius:var(--rad);outline:0}
[data-design=sketch] .fld{border-color:var(--fg)}textarea.fld{height:110px;padding:10px}
/* shell */
.rail{position:fixed;z-index:30;left:0;top:0;bottom:0;width:var(--rail);padding:18px 0;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--cd);border-right:var(--br) solid var(--fg)}
[data-design=flat] .rail{box-shadow:1px 0 0 var(--mu)}[data-design=neon] .rail{border-color:color-mix(in srgb,var(--ac) 40%,#000)}
.logo{font:800 28px var(--fh);color:var(--ac);width:44px;height:44px;display:grid;place-items:center;margin-bottom:14px}
.rail .sp{flex:1}.rail .ib{width:52px;height:52px;position:relative}
.rail .ib small{position:absolute;bottom:-2px;font-size:10px;color:var(--dim)}
main{margin-left:var(--rail);padding:34px clamp(18px,4vw,48px) 60px;max-width:1180px}
@media(max-width:700px){:root{--rail:0px}.rail{inset:auto 0 0 0;width:auto;height:calc(62px + env(safe-area-inset-bottom));flex-direction:row;justify-content:space-around;padding:0 6px env(safe-area-inset-bottom);border-right:0;border-top:var(--br) solid var(--fg)}.logo,.rail .sp{display:none}main{padding-bottom:100px}}
/* home */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:22px}
.top h1{font-size:clamp(34px,6vw,54px);line-height:1}.top p{margin:6px 0 0;color:var(--dim)}
.stats{display:flex;gap:10px;flex-wrap:wrap}.chip{padding:8px 14px;border-radius:99px;background:var(--cd);border:max(1px,var(--br)) solid color-mix(in srgb,var(--fg) 15%,transparent);font-size:15px}
[data-design=retro] .chip{border-radius:0}
.cont{display:flex;gap:20px;padding:18px;margin-bottom:26px;align-items:center;background:linear-gradient(120deg,var(--cd),color-mix(in srgb,var(--ac) 14%,var(--cd)))}
.cont .cv{width:92px;flex:none}.cont h2{font-size:24px}.cont p{margin:4px 0 12px;color:var(--dim);font-size:15px}
.tools{display:flex;gap:10px;margin-bottom:22px}.tools select{width:190px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:26px 20px}
.bk{display:block;width:100%;text-align:left;overflow:hidden;position:relative;transition:transform .15s}.bk:hover{transform:translateY(-4px)}
.cv{aspect-ratio:2/3;border-radius:calc(var(--rad)/2) ;display:flex;align-items:flex-end;padding:12px;font:700 19px/1.15 var(--fh);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);overflow:hidden}
[data-design=sketch] .cv,[data-design=retro] .cv{border-radius:0}
.bk .cv{border-radius:0}.bk .m{padding:10px 12px 12px}.bk b{display:block;font-size:16px;line-height:1.2;overflow-wrap:anywhere}.bk small{color:var(--dim);display:block;margin-top:2px}
.bar{height:6px;background:var(--mu);margin-top:9px;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.rt{color:#F59E0B;letter-spacing:1px;font-size:14px}
.del{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:none;place-items:center}.bk:hover .del,.bk:focus-within .del{display:grid}
@media(hover:none){.del{display:grid}}
.empty{text-align:center;padding:50px 20px}.empty h2{font-size:26px;margin-bottom:6px}
/* add */
#drop{padding:44px 20px;text-align:center;border-style:dashed;transition:transform .12s}#drop.over{transform:scale(1.015);background:color-mix(in srgb,var(--ac) 14%,var(--cd))}
#drop .big{font-size:48px}#drop p{color:var(--dim);margin:6px 0 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}@media(max-width:560px){.two{grid-template-columns:1fr}}
/* reader */
#prog{position:fixed;top:0;left:0;height:4px;background:var(--ac);width:0;z-index:60}
#bar{position:fixed;z-index:40;top:calc(env(safe-area-inset-top) + 10px);left:calc(var(--rail) + 12px);right:12px;max-width:760px;margin:0 auto;display:flex;align-items:center;padding:4px 8px;transition:transform .3s}
#bar.away{transform:translateY(-160%)}#bar .t{flex:1;min-width:0;text-align:center;font:700 16px var(--fh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
article{width:calc(100% - 20px);max-width:var(--w);margin:86px auto 150px;padding:clamp(22px,5vw,56px);font:var(--fs)/var(--lh) var(--rf);text-align:var(--ta);hyphens:auto}
article h2{font:700 1.6em/1.2 var(--fh);margin-bottom:1em}
article p{margin:0 0 1.1em}article p:first-of-type::first-letter{font:700 3.2em/.8 var(--fh);float:left;margin:.07em .1em 0 0;color:var(--ac)}
article p.say{background:color-mix(in srgb,var(--ac) 16%,transparent);border-radius:8px}
mark{background:#FDE68A;color:#222;border-radius:3px;padding:0 2px}
.pill{position:fixed;z-index:40;left:calc(50% + var(--rail)/2);transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;align-items:center;gap:4px;padding:6px 8px;max-width:calc(100vw - 16px);transition:transform .3s,opacity .3s}
.pill.away{transform:translate(-50%,200%)}#pos{min-width:90px;text-align:center;font-size:14px;color:var(--dim);line-height:1.1}
@media(max-width:700px){.pill{left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px)}}
.sheet{position:fixed;z-index:70;padding:16px;overflow:auto;top:calc(env(safe-area-inset-top) + 10px);bottom:10px;width:min(380px,calc(100vw - 20px))}
#toc{left:calc(var(--rail) + 10px)}#set{right:10px;top:calc(env(safe-area-inset-top) + 10px);bottom:auto;max-height:calc(100vh - 20px)}
@media(max-width:700px){#toc{left:10px}}
#scrim{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.35)}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button,.seg button{flex:1;padding:8px;border-radius:var(--rad);background:var(--mu);font-size:15px}.tabs .on,.seg .on{background:var(--ac);color:#fff}
.seg{display:flex;gap:6px;margin-bottom:4px}
.row{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:10px}.row:hover,.row.cur{background:var(--mu)}.row small{display:block;color:var(--dim)}
.lab{display:flex;justify-content:space-between;margin:14px 0 4px;font-size:15px;color:var(--dim)}
input[type=range]{width:100%;accent-color:var(--ac)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:2px solid var(--mu)}.sw .on{border-color:var(--cd);outline:2px solid var(--fg)}
.des{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.des button{padding:8px 2px;font-size:13px;border-radius:var(--rad);background:var(--mu)}.des .on{background:var(--ac);color:#fff}
#hl{position:fixed;z-index:80;min-height:40px;padding:0 14px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:99px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.nx{width:100%;margin-top:36px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<nav class="rail card" id="rail" aria-label="Main">
  <div class="logo">S</div>
  <button class="ib" data-a="home" title="Library" aria-label="Library">🏠</button>
  <button class="ib" data-a="add" title="Add book" aria-label="Add book">➕</button>
  <button class="ib" data-a="resume" title="Continue reading" aria-label="Continue reading">📖</button>
  <div class="sp"></div>
  <button class="ib" data-a="set" title="Appearance" aria-label="Appearance">🎨</button>
</nav>
<div id="prog"></div>
<main id="app"></main>
<div id="toast" role="status"></div>
<button id="hl" class="btn hid">🖍 Highlight</button>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACC=['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899'],DES=['sketch','flat','retro','glass','neon'],MODES=['light','dark','sepia'];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Storage full. Remove a book to free space.');return false}};
let lib=ld('shelf2:lib',[]).filter(b=>b&&b.id&&b.title&&b.pos&&b.n),cfg=Object.assign({design:'flat',mode:'light',ac:0,fs:21,lh:1.8,w:700,ta:'left',serif:1},ld('shelf2:cfg',{})),days=ld('shelf2:days',{});
let view='home',cur=null,chs=[],ci=0,sort='recent',q='',tick=null,away=false,lastY=0;
const save=()=>sv('shelf2:lib',lib),today=()=>new Date().toISOString().slice(0,10);
function theme(){const r=document.documentElement;r.dataset.design=cfg.design;r.dataset.mode=cfg.mode;r.style.setProperty('--ac',cfg.design=='retro'?'#000080':ACC[cfg.ac]);
 r.style.setProperty('--fs',cfg.fs+'px');r.style.setProperty('--lh',cfg.lh);r.style.setProperty('--w',cfg.w+'px');r.style.setProperty('--ta',cfg.ta);
 r.style.setProperty('--rf',cfg.serif?(cfg.design=='sketch'?'"Patrick Hand",cursive':'Fraunces,Georgia,serif'):'var(--fb)');sv('shelf2:cfg',cfg)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
const grad=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%360;return`linear-gradient(150deg,hsl(${h} 70% 48%),hsl(${(h+50)%360} 70% 36%))`};
const cover=b=>`<div class="cv" style="background:${b.cover?`url(${esc(b.cover)}) center/cover`:grad(b.title)}">${b.cover?'':esc(b.title)}</div>`;
const pct=b=>Math.min(100,Math.round(((b.pos.c+b.pos.p)/b.n)*100));
const mins=()=>days[today()]||0;
function streak(){let n=0,d=new Date();if(!days[today()])d.setDate(d.getDate()-1);while(days[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}
/* import */
function split(txt){txt=txt.replace(/\r/g,'').trim();const re=/^\s*((chapter|part|book|prologue|epilogue|prelude|interlude)\b[^\n]{0,80}|\d{1,3}[.)]\s+[^\n]{2,70})$/gim;let m,idx=[];while(m=re.exec(txt))idx.push({i:m.index,t:m[1].trim()});
 let out=[];if(idx.length>=2){idx.forEach((x,k)=>{const body=txt.slice(x.i+txt.slice(x.i).indexOf('\n'),idx[k+1]?idx[k+1].i:undefined).trim();if(body.length>40)out.push({t:x.t,x:body})})}
 if(out.length<2){out=[];const ps=txt.split(/\n\s*\n/);let buf=[],w=0;ps.forEach(p=>{buf.push(p);w+=p.split(/\s+/).length;if(w>2800){out.push({t:'Part '+(out.length+1),x:buf.join('\n\n')});buf=[];w=0}});if(buf.length)out.push({t:'Part '+(out.length+1),x:buf.join('\n\n')})}return out}
function addBook(title,author,txt,cv,pre){const c=pre||split(txt);if(!c.length)return toast('That file has no readable text.');const id='b'+Date.now();
 if(!sv('shelf2:t:'+id,c))return;lib.unshift({id,title:title||'Untitled',author:author||'Unknown',n:c.length,words:c.reduce((n,x)=>n+x.x.split(/\s+/).length,0),added:Date.now(),last:0,rating:0,cover:cv||'',pos:{c:0,p:0},marks:[],hl:[]});save();toast('Added “'+(title||'Untitled')+'”');go('home')}
const _ld={};function loadJS(u){return _ld[u]||(_ld[u]=new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('Could not load '+u));document.head.appendChild(e)}))}
async function parseEpub(buf){await loadJS('jszip.min.js');const z=await JSZip.loadAsync(buf),dp=new DOMParser(),xml=t=>dp.parseFromString(t,'application/xml');
 const rd=async p=>{const f=z.file(p)||z.file(decodeURIComponent(p));return f?f.async('string'):''};
 const norm=p=>{const o=[];p.split('/').forEach(x=>{if(x=='..')o.pop();else if(x&&x!='.')o.push(x)});return o.join('/')};
 const opfP=xml(await rd('META-INF/container.xml')).getElementsByTagName('rootfile')[0].getAttribute('full-path'),opf=xml(await rd(opfP)),base=opfP.replace(/[^/]*$/,'');
 const man={};[...opf.getElementsByTagName('item')].forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));
 const g=n=>(opf.getElementsByTagName(n)[0]||{}).textContent;const out=[];
 for(const r of opf.getElementsByTagName('itemref')){const h=man[r.getAttribute('idref')];if(!h)continue;const d=dp.parseFromString(await rd(norm(base+h.split('#')[0])),'text/html');
  let t=(d.querySelector('h1,h2,h3')||{}).textContent;t=t&&t.trim().replace(/\s+/g,' ');
  let ps=[...d.querySelectorAll('p,h1,h2,h3,h4,li')].map(e=>e.textContent.trim().replace(/\s+/g,' ')).filter(Boolean);if(ps[0]&&ps[0]==t)ps.shift();
  const x=ps.join('\n\n');if(x.length>120)out.push({t:(t&&t.length<90?t:'Chapter '+(out.length+1)),x})}
 if(!out.length)throw new Error('no readable chapters found');return{title:g('dc:title'),author:g('dc:creator'),chapters:out}}
async function parsePdf(buf){await loadJS('pdf.min.js');if(!window.pdfjsLib)throw new Error('pdf.js not available');pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
 const pdf=await pdfjsLib.getDocument({data:buf}).promise,pg=[];
 for(let i=1;i<=pdf.numPages;i++){if(i%10==0)toast('Reading page '+i+' / '+pdf.numPages);const tc=await(await pdf.getPage(i)).getTextContent();let s='',y=null;
  for(const it of tc.items){const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>1)s+=Math.abs(yy-y)>(it.height||10)*1.8?'\n\n':' ';s+=it.str;y=yy}pg.push(s.replace(/[ \t]+/g,' ').trim())}
 if(pg.join('').length<50)throw new Error('no text found (scanned PDF?)');const out=[];
 for(let i=0;i<pg.length;i+=8){const x=pg.slice(i,i+8).join('\n\n').trim();if(x)out.push({t:'Pages '+(i+1)+'–'+Math.min(i+8,pg.length),x})}
 let m={};try{m=(await pdf.getMetadata()).info||{}}catch{}return{title:m.Title,author:m.Author,chapters:out}}
async function readFiles(fs){const t=$('#ttl'),a=$('#aut'),c=$('#cvu');for(const f of fs){const ext=(f.name.split('.').pop()||'').toLowerCase(),nm=(fs.length==1&&t&&t.value)||f.name.replace(/\.\w+$/,'').replace(/[_-]+/g,' ');
 try{if(ext=='epub'||ext=='pdf'){toast('Importing '+f.name+'…');const r=await(ext=='epub'?parseEpub:parsePdf)(await f.arrayBuffer());addBook((t&&t.value)||r.title||nm,(a&&a.value)||r.author,'',c&&c.value,r.chapters)}
 else if(/^(txt|md|text)$/.test(ext))addBook(nm,a&&a.value,await f.text(),c&&c.value);else toast('Supported: .txt .md .pdf .epub')}catch(err){toast('Import failed: '+err.message)}}}
/* views */
function go(v){view=v;stopSay();clearInterval(tick);document.body.dataset.v=v;$('#prog').style.width=0;closeSheets();
 if(v=='home')home();else if(v=='add')add();window.scrollTo(0,0)}
function home(){let L=lib.filter(b=>(b.title+b.author).toLowerCase().includes(q.toLowerCase()));
 L.sort((a,b)=>sort=='title'?a.title.localeCompare(b.title):sort=='rating'?b.rating-a.rating:sort=='progress'?pct(b)-pct(a):sort=='recent'?(b.last||b.added)-(a.last||a.added):b.added-a.added);
 const r=lib.filter(b=>b.last).sort((a,b)=>b.last-a.last)[0];
 $('#app').innerHTML=`<div class="top"><div><h1>Shelf</h1><p>Your own webnovel-style library.</p></div><div class="stats"><span class="chip">🔥 ${streak()}-day streak</span><span class="chip">⏱ ${mins()} min today</span><span class="chip">📚 ${lib.length} books</span></div></div>
 ${r?`<div class="card cont"><div class="cv" style="${'background:'+(r.cover?`url(${esc(r.cover)}) center/cover`:grad(r.title))};width:92px;flex:none">${r.cover?'':''}</div><div style="flex:1;min-width:0"><h2>${esc(r.title)}</h2><p>Chapter ${r.pos.c+1} of ${r.n} · ${pct(r)}% done</p><div class="bar" style="margin:0 0 14px"><i style="width:${pct(r)}%"></i></div><button class="btn" data-a="open" data-id="${r.id}">▶ Continue reading</button></div></div>`:''}
 <div class="tools"><input class="fld" id="q" placeholder="Search your library…" value="${esc(q)}" aria-label="Search"><select class="fld" id="so" aria-label="Sort">${[['recent','Recently read'],['added','Newest added'],['title','Title A–Z'],['progress','Progress'],['rating','Top rated']].map(o=>`<option value="${o[0]}" ${sort==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
 ${L.length?`<div class="grid">${L.map(b=>`<div class="bk card"><button class="bk" style="all:unset;display:block;cursor:pointer;width:100%" data-a="open" data-id="${b.id}">${cover(b)}<div class="m"><b>${esc(b.title)}</b><small>${esc(b.author)} · ${b.n} ch · ~${Math.round(b.words/1000)}k words</small><div class="rt">${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</div><div class="bar"><i style="width:${pct(b)}%"></i></div></div></button><button class="del" data-a="del" data-id="${b.id}" aria-label="Delete ${esc(b.title)}">🗑</button></div>`).join('')}</div>`
 :`<div class="card empty"><h2>${lib.length?'No matches':'Your shelf is empty'}</h2><p style="color:var(--dim)">${lib.length?'Try a different search.':'Add a .txt or .md book to start reading.'}</p>${lib.length?'':'<button class="btn" data-a="add">➕ Add your first book</button>'}</div>`}`;
 const qi=$('#q');qi.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;home();const n=$('#q');n.focus();n.setSelectionRange(p,p)};$('#so').onchange=e=>{sort=e.target.value;home()}}
function add(){$('#app').innerHTML=`<div class="top"><div><h1>Add a book</h1><p>Chapters are detected automatically. Everything stays on this device.</p></div></div>
 <div class="two"><div><label for="ttl">Title (optional)</label><input class="fld" id="ttl"></div><div><label for="aut">Author (optional)</label><input class="fld" id="aut"></div></div>
 <label for="cvu">Cover image URL (optional)</label><input class="fld" id="cvu" placeholder="https://…" style="margin-bottom:16px">
 <div id="drop" class="card"><div class="big">📚</div><h2>Drop PDF, EPUB, .txt or .md files here</h2><p>Or pick them from your device</p><button class="btn" id="pick">Choose files</button><input type="file" id="fi" accept=".txt,.md,.text,.pdf,.epub" multiple hidden></div>
 <label for="paste" style="display:block;margin-top:18px">Or paste text</label><textarea class="fld" id="paste" placeholder="Paste a story or article…"></textarea><button class="btn" id="pb" style="margin-top:10px">Add pasted text</button>`;
 const d=$('#drop');$('#pick').onclick=()=>$('#fi').click();$('#fi').onchange=e=>readFiles([...e.target.files]);
 ['dragenter','dragover'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.remove('over')}));d.addEventListener('drop',e=>readFiles([...e.dataTransfer.files]));
 $('#pb').onclick=()=>{const t=$('#paste').value.trim();t?addBook($('#ttl').value||'Pasted text',$('#aut').value,t,$('#cvu').value):toast('Paste some text first.')}}
/* reader */
function openBook(id,c,p){cur=lib.find(b=>b.id==id);if(!cur)return;chs=ld('shelf2:t:'+id,[]);if(!chs.length)return toast('Book text is missing.');view='read';document.body.dataset.v='read';
 cur.last=Date.now();save();draw(c??cur.pos.c,p??cur.pos.p);clearInterval(tick);let s=0;tick=setInterval(()=>{if(document.hidden||away&&0)return;s+=15;if(s>=60){s=0;days[today()]=(days[today()]||0)+1;sv('shelf2:days',days)}},15000)}
function paint(t){let h=esc(t);(cur.hl||[]).filter(x=>x.c==ci).forEach(x=>{const e=esc(x.s);h=h.replace(e,'<mark>'+e+'</mark>')});return h}
function draw(c,p=0){ci=Math.max(0,Math.min(chs.length-1,c));const ch=chs[ci];
 $('#app').innerHTML=`<div id="bar" class="card"><button class="ib" data-a="home" aria-label="Back">←</button><div class="t">${esc(cur.title)} · ${esc(ch.t)}</div><button class="ib" data-a="toc" aria-label="Chapters">☰</button><button class="ib" data-a="set" aria-label="Appearance">Aa</button></div>
 <article class="card"><h2>${esc(ch.t)}</h2>${ch.x.split(/\n\s*\n|\n/).filter(s=>s.trim()).map(s=>`<p>${paint(s.trim())}</p>`).join('')}
 <div class="stars" style="text-align:center;margin-top:30px"><div class="rt" style="font-size:30px">${[1,2,3,4,5].map(n=>`<button data-a="rate" data-n="${n}" aria-label="${n} stars" style="color:${n<=cur.rating?'#F59E0B':'var(--dim)'}">${n<=cur.rating?'★':'☆'}</button>`).join('')}</div></div>
 ${ci<chs.length-1?`<button class="btn nx" data-a="next">Next: ${esc(chs[ci+1].t)} →</button>`:`<button class="btn nx" data-a="home">You finished it. Back to library</button>`}</article>
 <div class="pill card" id="pill"><button class="ib" data-a="prev" aria-label="Previous chapter" ${ci?'':'disabled'}>◀</button><button class="ib" data-a="toc" aria-label="Chapters">☰</button><div id="pos">Ch ${ci+1} / ${chs.length}<br><span id="pc">0%</span></div><button class="ib ${cur.marks.some(m=>m==ci)?'on':''}" data-a="mark" aria-label="Bookmark">🔖</button><button class="ib" data-a="say" id="sy" aria-label="Listen">🎧</button><button class="ib" data-a="next" aria-label="Next chapter" ${ci<chs.length-1?'':'disabled'}>▶</button></div>`;
 cur.pos.c=ci;save();requestAnimationFrame(()=>{const h=document.documentElement.scrollHeight-innerHeight;window.scrollTo(0,h*p);scr()})}
function scr(){if(view!='read')return;const h=document.documentElement.scrollHeight-innerHeight,p=h>0?scrollY/h:0;$('#prog').style.width=p*100+'%';const e=$('#pc');if(e)e.textContent=Math.round(p*100)+'%';
 cur.pos.p=p;clearTimeout(scr.t);scr.t=setTimeout(save,500);const a=scrollY>lastY&&scrollY>140;if(a!=away){away=a;$('#bar')?.classList.toggle('away',a);$('#pill')?.classList.toggle('away',a)}lastY=scrollY}
addEventListener('scroll',scr,{passive:true});
/* sheets */
function closeSheets(){document.querySelectorAll('.sheet,#scrim').forEach(e=>e.remove())}
function sheet(id,html){closeSheets();document.body.insertAdjacentHTML('beforeend',`<div id="scrim"></div><div class="sheet card" id="${id}">${html}</div>`);$('#scrim').onclick=closeSheets}
function toc(tab='ch'){const L=tab=='ch'?chs.map((c,i)=>({i,t:c.t,s:''})):tab=='bm'?cur.marks.map(i=>({i,t:chs[i].t,s:'Bookmark'})):(cur.hl||[]).map(h=>({i:h.c,t:chs[h.c].t,s:'“'+h.s.slice(0,70)+'”'}));
 sheet('toc',`<h3>${esc(cur.title)}</h3><div class="tabs">${[['ch','Chapters'],['bm','Bookmarks'],['hl','Highlights']].map(t=>`<button class="${tab==t[0]?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>${tab=='ch'?'<input class="fld" id="tq" placeholder="Find chapter…" style="margin-bottom:8px">':''}<div id="tl">${L.map(x=>`<button class="row ${x.i==ci?'cur':''}" data-a="goto" data-i="${x.i}">${esc(x.t)}<small>${esc(x.s)}</small></button>`).join('')||'<p style="color:var(--dim)">Nothing here yet.</p>'}</div>`);
 const t=$('#tq');if(t)t.oninput=e=>document.querySelectorAll('#tl .row').forEach(r=>r.classList.toggle('hid',!r.textContent.toLowerCase().includes(e.target.value.toLowerCase())))}
function settings(){const seg=(k,o)=>`<div class="seg">${o.map(x=>`<button class="${cfg[k]==x[0]?'on':''}" data-a="cfg" data-k="${k}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
 sheet('set',`<h3>Appearance</h3><div class="lab">Design</div><div class="des">${DES.map(d=>`<button class="${cfg.design==d?'on':''}" data-a="cfg" data-k="design" data-v="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join('')}</div>
 <div class="lab">Mode</div>${seg('mode',MODES.map(m=>[m,m[0].toUpperCase()+m.slice(1)]))}<div class="lab">Accent</div><div class="sw">${ACC.map((c,i)=>`<button class="${cfg.ac==i?'on':''}" style="background:${c}" data-a="cfg" data-k="ac" data-v="${i}" aria-label="Accent ${i+1}"></button>`).join('')}</div>
 <div class="lab"><span>Text size</span><span>${cfg.fs}px</span></div><input type="range" min="15" max="32" value="${cfg.fs}" data-r="fs"><div class="lab"><span>Line height</span><span>${cfg.lh}</span></div><input type="range" min="1.3" max="2.4" step=".1" value="${cfg.lh}" data-r="lh">
 <div class="lab"><span>Page width</span><span>${cfg.w}px</span></div><input type="range" min="420" max="1000" step="20" value="${cfg.w}" data-r="w"><div class="lab">Alignment</div>${seg('ta',[['left','Left'],['justify','Justify']])}<div class="lab">Font</div>${seg('serif',[[1,'Serif'],[0,'Sans']])}`);
 document.querySelectorAll('[data-r]').forEach(r=>r.oninput=e=>{cfg[r.dataset.r]=+e.target.value;theme();r.previousElementSibling.lastChild.textContent=e.target.value+(r.dataset.r=='lh'?'':'px')})}
/* listen */
let sp=null;function stopSay(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch{}sp=null;document.querySelectorAll('p.say').forEach(p=>p.classList.remove('say'));const b=$('#sy');if(b)b.classList.remove('on')}
function say(){if(sp)return stopSay();if(!('speechSynthesis' in window))return toast('Listening is not supported here.');const ps=[...document.querySelectorAll('article p')];let i=0;sp=1;$('#sy').classList.add('on');
 (function nx(){if(!sp||i>=ps.length)return stopSay();const p=ps[i++];p.classList.add('say');p.scrollIntoView({block:'center',behavior:'smooth'});const u=new SpeechSynthesisUtterance(p.textContent);u.onend=()=>{p.classList.remove('say');nx()};speechSynthesis.speak(u)})()}
/* events */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,d=t.dataset;
 if(a=='home')go('home');else if(a=='add')go('add');else if(a=='resume'){const r=lib.filter(b=>b.last).sort((a,b)=>b.last-a.last)[0]||lib[0];r?openBook(r.id):toast('Add a book first.')}
 else if(a=='open')openBook(d.id);else if(a=='del'){if(confirm('Remove this book from your shelf?')){lib=lib.filter(b=>b.id!=d.id);localStorage.removeItem('shelf2:t:'+d.id);save();home()}}
 else if(a=='set')settings();else if(a=='toc')toc();else if(a=='tab')toc(d.t);else if(a=='goto'){closeSheets();stopSay();draw(+d.i)}
 else if(a=='next'){stopSay();draw(ci+1)}else if(a=='prev'){stopSay();draw(ci-1)}else if(a=='say')say();
 else if(a=='mark'){const k=cur.marks.indexOf(ci);k<0?cur.marks.push(ci):cur.marks.splice(k,1);save();t.classList.toggle('on',k<0);toast(k<0?'Bookmarked':'Bookmark removed')}
 else if(a=='rate'){cur.rating=cur.rating==+d.n?0:+d.n;save();draw(ci,cur.pos.p)}
 else if(a=='cfg'){cfg[d.k]=isNaN(d.v)?d.v:+d.v;theme();settings()}});
$('#hl').onclick=()=>{const s=getSelection().toString().trim();if(s&&s.length<400&&cur){cur.hl=cur.hl||[];cur.hl.push({c:ci,s});save();const p=cur.pos.p;draw(ci,p);toast('Highlighted')}getSelection().removeAllRanges();$('#hl').classList.add('hid')};
document.addEventListener('selectionchange',()=>{const s=getSelection(),b=$('#hl');if(view!='read'||s.isCollapsed||!s.anchorNode||!s.anchorNode.parentElement.closest('article p')){b.classList.add('hid');return}const r=s.getRangeAt(0).getBoundingClientRect();b.classList.remove('hid');b.style.left=Math.max(8,Math.min(innerWidth-130,r.left))+'px';b.style.top=Math.max(8,r.top-52)+'px'});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='Escape')closeSheets();if(view!='read')return;
 if(e.key=='ArrowRight'&&ci<chs.length-1)draw(ci+1);else if(e.key=='ArrowLeft'&&ci>0)draw(ci-1);else if(e.key=='t')toc();else if(e.key=='s')settings()});
addEventListener('error',e=>{if(view=='home'&&!$('#app').children.length)$('#app').innerHTML='<div class="card empty"><h2>Something broke</h2><p>'+esc(e.message)+'</p></div>'});
theme();go('home');
</script>
</body>
</html>
