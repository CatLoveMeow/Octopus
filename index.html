<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="description" content="Shelf is a calm, private reading space for your personal library.">
<link rel="manifest" href="./manifest.webmanifest">
<title>Shelf — your reading space</title>
<style>
:root{color-scheme:light;--bg:#f5f3ee;--panel:#fffefa;--text:#282a27;--muted:#73776f;--line:#e5e3db;--accent:#496b56;--accent-ink:#fff;--soft:#e9eee8;--shadow:0 10px 35px #292a2410;--radius:18px;--reader-font:Georgia,serif;--reader-size:21px;--reader-line:1.85;--reader-width:720px}
[data-theme=dark]{color-scheme:dark;--bg:#171a18;--panel:#202521;--text:#eef0e9;--muted:#a6ada4;--line:#343b35;--accent:#a7c9ad;--accent-ink:#152017;--soft:#2b352d;--shadow:0 10px 35px #0003}
[data-theme=sepia]{color-scheme:light;--bg:#eee2ca;--panel:#f9f0dd;--text:#443727;--muted:#85745e;--line:#dfd0b4;--accent:#806143;--accent-ink:#fff9ed;--soft:#e8dac0}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:1240px;margin:auto;padding:28px clamp(16px,4vw,44px) 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 24px Georgia,serif}.brand h1{font:700 30px/1 Georgia,serif;letter-spacing:-1px;margin:0}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.actions,.row{display:flex;align-items:center;gap:10px}.btn{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:10px 14px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}.btn.subtle{background:var(--soft);border-color:transparent}.btn.icon{width:42px;padding:0;font-size:19px}.hidden{display:none!important}.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr);gap:18px;margin-bottom:30px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.continue{padding:24px;display:flex;gap:20px;align-items:center;min-height:205px}.cover{aspect-ratio:2/3;width:106px;flex:none;display:grid;place-items:center;text-align:center;padding:12px;color:#fff;font:700 25px Georgia,serif;background:linear-gradient(145deg,#587d68,#253f34);border-radius:8px;overflow:hidden;object-fit:cover}.continue .cover{width:105px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:750}.continue h2{font:700 25px/1.2 Georgia,serif;margin:8px 0}.muted{color:var(--muted)}.small{font-size:13px}.progress{height:5px;background:var(--line);border-radius:20px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:var(--accent);border-radius:20px}.summary{padding:24px;display:flex;flex-direction:column;justify-content:center;gap:14px}.stat{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.stat strong{font:700 27px Georgia,serif}.toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center}.search{flex:1;position:relative}.field{width:100%;min-height:44px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 16px}.section-head h2{font:700 25px Georgia,serif;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 18px}.book{position:relative;min-width:0}.book-open{border:0;background:transparent;color:inherit;text-align:left;width:100%;padding:0;border-radius:12px}.book-open:focus-visible{outline-offset:4px}.book .cover{width:100%;border-radius:10px;box-shadow:0 7px 18px #00000012;transition:transform .15s}.book-open:hover .cover{transform:translateY(-3px)}.book-title{font-weight:700;line-height:1.3;margin-top:10px;overflow-wrap:anywhere}.book-sub{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book-progress{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}.book-menu{position:absolute;right:5px;top:5px;border:0;border-radius:50%;background:#171a18b8;color:white;width:34px;height:34px}.empty{padding:50px 20px;text-align:center}.empty h2{font:700 25px Georgia,serif;margin:0 0 8px}.empty p{max-width:420px;margin:0 auto 18px;color:var(--muted)}.reader-top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px max(16px,calc((100vw - 920px)/2));display:flex;align-items:center;gap:8px}.reader-title{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;font-size:14px}.reader-progress{height:3px;background:var(--line)}.reader-progress i{display:block;height:100%;background:var(--accent);width:0}.reader{max-width:var(--reader-width);margin:44px auto 120px;padding:0 24px;font:var(--reader-size)/var(--reader-line) var(--reader-font);overflow-wrap:break-word;text-align:var(--reader-align,left);hyphens:var(--reader-hyphens,manual)}.reader h2{font:700 1.5em/1.25 system-ui,sans-serif;margin:0 0 1.6em;letter-spacing:-.03em}.reader p{margin:0 0 var(--reader-gap,1.15em);white-space:pre-wrap;word-break:normal;overflow-wrap:break-word}.reader p:first-of-type{margin-top:0}.reader p mark{background:#f7df88;color:#28261e;border-radius:3px;padding:0 2px}.reader-footer{max-width:var(--reader-width);margin:0 auto 50px;padding:0 24px;display:flex;justify-content:space-between;gap:10px}.reader-controls{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:5px;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px #0002;max-width:calc(100vw - 20px)}.reader-controls .btn{border:0;background:transparent;min-width:40px;padding:7px}.reader-controls .position{min-width:76px;text-align:center;font-size:12px;color:var(--muted)}.reader-controls .active{background:var(--soft)}.page{max-width:820px;margin:0 auto;padding:10px 0}.back{margin-bottom:20px}.detail{display:flex;gap:24px;padding:24px;margin-bottom:25px}.detail .cover{width:150px}.detail h2{font:700 clamp(26px,4vw,40px)/1.1 Georgia,serif;margin:4px 0 8px;overflow-wrap:anywhere}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.chapter-list{overflow:hidden}.chapter-row{display:flex;width:100%;text-align:left;justify-content:space-between;gap:10px;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text)}.chapter-row:last-child{border-bottom:0}.chapter-row:hover,.chapter-row.current{background:var(--soft)}.chapter-row small{color:var(--muted)}.overlay{position:fixed;inset:0;background:#0008;z-index:20;display:flex;justify-content:flex-end}.drawer{width:min(420px,100%);height:100%;overflow:auto;background:var(--panel);padding:22px;border-left:1px solid var(--line)}.drawer h2{font:700 25px Georgia,serif;margin:0 0 20px}.setting{margin:18px 0}.setting label{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:7px}.setting input[type=range]{width:100%;accent-color:var(--accent)}.seg{display:flex;gap:7px;flex-wrap:wrap}.seg button{flex:1}.toast{position:fixed;z-index:30;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;max-width:calc(100vw - 24px);box-shadow:var(--shadow)}.drop{border:2px dashed var(--line);border-radius:18px;padding:30px;text-align:center}.drop.drag{border-color:var(--accent);background:var(--soft)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-label{display:block;font-size:13px;font-weight:650;margin:0 0 6px}.notice{padding:12px 14px;border-radius:12px;background:var(--soft);font-size:13px;color:var(--muted);margin:14px 0}.footer-note{text-align:center;color:var(--muted);font-size:12px;margin:32px 0}.chapter-search{margin-bottom:12px}
@media(max-width:700px){.app{padding-top:20px}.hero{grid-template-columns:1fr}.summary{padding:18px}.continue{padding:18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}.cover{font-size:20px}.book-title{font-size:14px}.book-sub{font-size:12px}.top{align-items:flex-start}.brand h1{font-size:27px}.top .actions .label{display:none}.reader{margin-top:30px;padding:0 22px}.reader-top{padding:8px}.detail{flex-direction:column;align-items:flex-start}.detail .cover{width:120px}.reader-controls{gap:0}.reader-controls .btn{min-width:36px;padding:6px}.reader-controls .position{min-width:64px}.two{grid-template-columns:1fr}}
@media(max-width:390px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.continue .cover{width:82px}.continue{gap:14px}.continue h2{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Personal control features */
.library-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px;align-items:center}
.library-controls .field{flex:1;min-width:125px}
.toggle-btn{min-height:44px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.toggle-btn[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--text)}
.book.favorite:after{content:"♥";position:absolute;top:9px;left:9px;background:var(--panel);color:#c43d57;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;box-shadow:0 2px 8px #0002}
.book{position:relative}
.grid.list-layout{display:flex;flex-direction:column;gap:10px}
.list-layout .book{display:flex;align-items:center;min-height:112px}
.list-layout .book-open{display:grid;grid-template-columns:66px minmax(0,1fr);align-items:center;gap:12px;text-align:left;flex:1}
.list-layout .cover{width:66px;height:92px;aspect-ratio:auto;margin:8px}
.list-layout .book-title,.list-layout .book-sub,.list-layout .book-progress,.list-layout .progress{grid-column:2}
.list-layout .book-title{margin-top:0}
.list-layout .book-menu{position:static;margin:8px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:99px;color:var(--muted)}
.detail-extra{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}

.goal-panel{padding:16px 20px;margin:0 0 22px}.reader-tools{display:flex;gap:8px;flex-wrap:wrap;max-width:var(--reader-width);margin:0 auto;padding:0 24px 12px}.reader-tools .field{flex:1;min-width:150px}.shelf-hit{background:color-mix(in srgb,#f7df88 35%,transparent);outline:2px solid #d5b34b}.shelf-select{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px}.shelf-select input{width:18px;height:18px;accent-color:var(--accent)}.danger{color:#b42318!important;border-color:#b42318!important}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<input id="file-input" type="file" accept=".txt,.md,.text,.pdf,.epub,.json" multiple hidden>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const DB_NAME='shelf-db', DB_VERSION=1;
let db, books=[], currentBook=null, chapters=[], chapterIndex=0, view='home', search='', sort='recent', libraryFilter='all', libraryLayout='grid', activeSpeech=null, speechParagraph=0, speechRate=1, settings={theme:'light',fontSize:21,lineHeight:1.75,width:720,font:'Serif',align:'left',textFormat:'preserve',paragraphGap:1.15};
const root=$('#root'), fileInput=$('#file-input');
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeText(v){return String(v??'').replace(/\u0000/g,'').trim();}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),3200);}
function id(){return 'b_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);}
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('books'))d.createObjectStore('books',{keyPath:'id'});if(!d.objectStoreNames.contains('chapters')){const s=d.createObjectStore('chapters',{keyPath:'key'});s.createIndex('bookId','bookId',{unique:false});}if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function reqPromise(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function getAll(store){return reqPromise(db.transaction(store,'readonly').objectStore(store).getAll());}
async function put(store,val){return reqPromise(db.transaction(store,'readwrite').objectStore(store).put(val));}
async function get(store,key){return reqPromise(db.transaction(store,'readonly').objectStore(store).get(key));}
async function removeBook(bookId){return new Promise((resolve,reject)=>{const tx=db.transaction(['books','chapters'],'readwrite');tx.objectStore('books').delete(bookId);const s=tx.objectStore('chapters'),idx=s.index('bookId'),req=idx.openCursor(IDBKeyRange.only(bookId));req.onsuccess=()=>{const c=req.result;if(c){c.delete();c.continue();}};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}
async function loadState(){books=(await getAll('books')).sort((a,b)=>(b.lastRead||b.added)-(a.lastRead||a.added));const saved=await get('settings','main');if(saved?.value)settings={...settings,...saved.value};if(settings.font==='Georgia')settings.font='Serif';if(!settings.textFormat)settings.textFormat='preserve';applySettings();}
function applySettings(){document.documentElement.dataset.theme=settings.theme;document.documentElement.style.setProperty('--reader-size',settings.fontSize+'px');document.documentElement.style.setProperty('--reader-line',settings.lineHeight);document.documentElement.style.setProperty('--reader-width',settings.width+'px');document.documentElement.style.setProperty('--reader-font',(settings.font==='Serif'||settings.font==='Georgia')?'Georgia, Times New Roman, serif':settings.font==='Sans'?'system-ui, sans-serif':settings.font==='Mono'?'ui-monospace, SFMono-Regular, monospace':'Georgia, serif');document.documentElement.style.setProperty('--reader-align',settings.align||'left');document.documentElement.style.setProperty('--reader-gap',(settings.paragraphGap??1.15)+'em');document.documentElement.style.setProperty('--reader-hyphens',settings.hyphenation?'auto':'manual');}
async function saveSettings(){await put('settings',{key:'main',value:settings});applySettings();}
function coverHTML(b,cls='cover'){const color=b.color||'#496b56';return b.cover?`<img class="${cls}" src="${esc(b.cover)}" alt="" loading="lazy">`:`<div class="${cls}" style="background:linear-gradient(145deg,${color},#202c26)">${esc((b.title||'?').trim().slice(0,1).toUpperCase())}</div>`;}
function pct(b){return Math.max(0,Math.min(100,Math.round(b.progress||0)));}
function calcProgress(b,ch){const total=b.totalWords||0;if(!total)return 0;const done=(b.chapterWordsDone||0)+(ch?.wordCount||0)*(b.position||0);return Math.round(Math.min(1,done/total)*100);}
function renderHome(){view='home';currentBook=null;const list=books.filter(b=>(b.title+' '+(b.author||'')+' '+(b.tags||[]).join(' ')).toLowerCase().includes(search.toLowerCase())).filter(b=>libraryFilter==='all'||(libraryFilter==='favorites'&&b.favorite)||(libraryFilter==='finished'&&b.finished)||(libraryFilter==='unread'&&!b.finished&&pct(b)===0)||(libraryFilter==='reading'&&!b.finished&&pct(b)>0)).sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='progress'?pct(b)-pct(a):sort==='added'?b.added-a.added:(b.lastRead||b.added)-(a.lastRead||a.added));const recent=books.filter(b=>b.lastRead).sort((a,b)=>b.lastRead-a.lastRead)[0];root.innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="mark">S</div><div><h1>Shelf</h1><p>A quieter place to read.</p></div></div><div class="actions"><button class="btn" data-action="backup">↥ <span class="label">Back up</span></button><button class="btn icon" data-action="settings" aria-label="Settings">⚙</button></div></header>
${recent?`<section class="hero"><div class="panel continue">${coverHTML(recent)}<div style="min-width:0;flex:1"><div class="eyebrow">Pick up where you left off</div><h2>${esc(recent.title)}</h2><div class="muted small">${esc(recent.author||'Unknown author')} · Chapter ${(recent.chapterIndex||0)+1}</div><div class="progress"><i style="width:${pct(recent)}%"></i></div><div class="muted small">${pct(recent)}% through this book</div><button class="btn primary" style="margin-top:14px" data-action="open" data-id="${recent.id}">Continue reading →</button></div></div><div class="panel summary"><div class="eyebrow">Your reading space</div><div class="stat"><span class="muted">Books on your shelf</span><strong>${books.length}</strong></div><div class="stat"><span class="muted">Finished</span><strong>${books.filter(b=>b.finished).length}</strong></div><div class="stat"><span class="muted">Stored on this device</span><strong>Local</strong></div><div class="small muted">Your books stay in this browser unless you export a backup.</div></div></section>`:''}
<div class="toolbar"><div class="search"><input id="search" class="field" type="search" placeholder="Search titles and authors…" value="${esc(search)}" aria-label="Search your library"></div><select id="sort" class="field" style="width:auto;max-width:165px" aria-label="Sort library"><option value="recent" ${sort==='recent'?'selected':''}>Recently read</option><option value="added" ${sort==='added'?'selected':''}>Recently added</option><option value="title" ${sort==='title'?'selected':''}>Title A–Z</option><option value="progress" ${sort==='progress'?'selected':''}>Progress</option></select><button class="btn primary" data-action="import">＋ <span class="label">Import</span></button></div>
<div class="library-controls"><select id="filter" class="field" aria-label="Filter books"><option value="all" ${libraryFilter==='all'?'selected':''}>All books</option><option value="reading" ${libraryFilter==='reading'?'selected':''}>Currently reading</option><option value="unread" ${libraryFilter==='unread'?'selected':''}>Not started</option><option value="finished" ${libraryFilter==='finished'?'selected':''}>Finished</option><option value="favorites" ${libraryFilter==='favorites'?'selected':''}>Favorites ♥</option></select><button class="toggle-btn" data-action="layout" aria-pressed="${libraryLayout==='list'}" title="Switch library layout">${libraryLayout==='grid'?'☷ List view':'▦ Grid view'}</button></div>
<div class="section-head"><h2>Your library</h2><span class="muted small">${list.length} ${list.length===1?'book':'books'}</span></div>
${list.length?`<section class="grid ${libraryLayout==='list'?'list-layout':''}">${list.map(b=>`<article class="book ${b.favorite?'favorite':''}"><button class="book-open" data-action="detail" data-id="${b.id}" aria-label="Open ${esc(b.title)}">${coverHTML(b)}<div class="book-title">${esc(b.title)}</div><div class="book-sub">${esc(b.author||'Unknown author')}</div><div class="book-progress"><span>${b.finished?'Finished':b.chapterCount+' chapters'}</span><span>${pct(b)}%</span></div><div class="progress"><i style="width:${pct(b)}%"></i></div></button><button class="book-menu" data-action="menu" data-id="${b.id}" aria-label="Book actions for ${esc(b.title)}">⋯</button></article>`).join('')}</section>`:`<section class="panel empty"><h2>${books.length?'No matching books yet':'Make this space yours.'}</h2><p>${books.length?'Try a different title or author.':'Import an EPUB, PDF, TXT or Markdown file. Your library is stored locally in this browser.'}</p><button class="btn primary" data-action="import">＋ Import your first book</button><p class="small" style="margin-top:14px">For safety, export a backup before clearing browser data.</p></section>`}
<div class="footer-note">Shelf · Private by design · Stored on this device</div></main>`;

function renderDetail(b){view='detail';currentBook=b;root.innerHTML=`<main class="app"><button class="btn back" data-action="home">← Library</button><section class="panel detail">${coverHTML(b)}<div style="flex:1;min-width:0"><div class="eyebrow">Book details</div><h2>${esc(b.title)}</h2><p class="muted">${esc(b.author||'Unknown author')}</p><p class="muted small">${b.chapterCount} chapters · ${(b.totalWords||0).toLocaleString()} words · ${pct(b)}% read</p><div class="progress"><i style="width:${pct(b)}%"></i></div><div class="detail-actions"><button class="btn primary" data-action="open" data-id="${b.id}">${b.lastRead?'Continue reading':'Start reading'} →</button><button class="btn" data-action="rename" data-id="${b.id}">Edit title, author & cover</button><button class="btn" data-action="export-book" data-id="${b.id}">Export book</button><button class="btn" data-action="delete" data-id="${b.id}">Remove</button><button class="btn" data-action="finish" data-id="${b.id}">${b.finished?'Mark unfinished':'Mark finished'}</button></div></div></section><div class="detail-extra"><div class="detail-actions"><button class="btn" data-action="favorite" data-id="${b.id}">${b.favorite?'♥ Remove favorite':'♡ Add favorite'}</button><button class="btn" data-action="tags" data-id="${b.id}">Edit tags</button><button class="btn" data-action="notes" data-id="${b.id}">Edit personal notes</button><button class="btn" data-action="shelf-collection" data-id="${b.id}">Collection</button><button class="btn" data-action="shelf-annotations" data-id="${b.id}">Annotations</button></div><div class="small muted">Collection: ${esc(b.collection||'Unsorted')}</div><div class="tagline">${(b.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${b.notes?`<p class="small muted" style="white-space:pre-wrap;margin-top:12px">${esc(b.notes)}</p>`:''}</div><div class="section-head"><h2>Chapters</h2><span class="muted small">${b.chapterCount} total</span></div><input class="field chapter-search // Reconstruct PDF text using text-run positions so visual lines and paragraph gaps survive.
function pdfPageToText(items){
  const rows=[];
  for(const item of items||[]){
    if(!item||typeof item.str!=='string'||!item.str.trim())continue;
    const tr=item.transform||[],x=Number(tr[4]||0),y=Number(tr[5]||0),height=Number(item.height||Math.abs(tr[3]||0)||10);
    let row=rows.find(r=>Math.abs(r.y-y)<=Math.max(2,height*.35));
    if(!row){row={y,height,items:[]};rows.push(row);}
    row.height=Math.max(row.height,height);row.items.push({x,width:Number(item.width||0),text:item.str});
  }
  rows.sort((a,b)=>b.y-a.y);
  const clean=[];
  for(const row of rows){
    row.items.sort((a,b)=>a.x-b.x);let line='',lastRight=null;
    for(const it of row.items){
      const part=it.text.trim();if(!part)continue;
      if(line&&lastRight!==null&&it.x-lastRight>row.height*.12&&!/\s$/.test(line))line+=' ';
      line+=part;lastRight=it.x+(it.width>0?it.width:Math.max(row.height*.2,part.length*row.height*.45));
    }
    line=line.replace(/[ \t]+/g,' ').trim();if(line)clean.push({y:row.y,height:row.height,text:line});
  }
  let out='';
  for(let i=0;i<clean.length;i++){
    const r=clean[i],prev=clean[i-1];
    if(i){const gap=prev.y-r.y,threshold=Math.max(prev.height,r.height)*1.65;out+=gap>threshold?'\n\n':'\n';}
    out+=r.text;
  }
  return out.trim();
}

  }
  line=line.replace(/[ \t]+/g,' ').trim();if(line)lines.push({y:row.y,height:row.height,text:line});
 }
 const gaps=[];for(let i=1;i<lines.length;i++){const g=lines[i-1].y-lines[i].y;if(g>0)gaps.push(g);}
 gaps.sort((a,b)=>a-b);
 const hs=lines.map(l=>l.height).sort((a,b)=>a-b),med=hs.length?hs[hs.length>>1]:10;
 const pitch=Math.max(gaps.length?gaps[Math.floor((gaps.length-1)*.25)]:0,med*1.05);
 let out='';
 for(let i=0;i<lines.length;i++){
  if(i){
   const ratio=(lines[i-1].y-lines[i].y)/pitch;
   if(ratio<1.35)out+='\n';
   else{out+='\n\n';const extra=Math.min(3,Math.max(0,Math.floor(ratio-1.5)));for(let n=0;n<extra;n++)out+=ZW+'\n\n';}
  }
  out+=lines[i].text;
 }
 return out.trim();
};

/* ---------- reader paragraphs (works on already-imported books too) ---------- */
readerParagraphs=function(text){
 const raw=String(text||'').replace(/\r\n?/g,'\n').trim();if(!raw)return[];
 const fmt=settings.textFormat,out=[];
 for(const block of raw.split(/\n[\t ]*\n+/)){
  if(block.trim()===ZW){if(fmt==='original')out.push(ZW);continue;}
  let b=block;if(settings.splitSpeakers)b=b.replace(SP_MID,'$1\n');
  const lines=b.split('\n').map(x=>x.trim()).filter(Boolean),groups=[];let buf=[];
  for(const ln of lines){if(settings.splitSpeakers&&buf.length&&SP.test(ln)){groups.push(buf);buf=[];}buf.push(ln);}
  if(buf.length)groups.push(buf);
  for(const g of groups)out.push(fmt==='preserve'?g.join('\n'):g.join(' '));
 }
 return out;
};

/* ---------- reader hooks: speaker labels, auto-scroll, wake lock ---------- */
let autoT=null,wl=null;
function startAuto(){clearInterval(autoT);autoT=null;if(view!=='reader'||!settings.autoScroll)return;
 autoT=setInterval(()=>{if(view!=='reader'||document.hidden)return;window.scrollBy({top:settings.autoScroll*.5,behavior:'instant'});},50);}
async function lockScreen(){try{
 if(settings.wakeLock&&view==='reader'&&'wakeLock'in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}
 else if((!settings.wakeLock||view!=='reader')&&wl){await wl.release();wl=null;}
}catch{}}
const prevReader=renderReader;
renderReader=function(){prevReader();const el=$('#reader');if(!el)return;
 $$('p[data-paragraph]',el).forEach(p=>{const t=p.textContent;
  if(t===ZW){p.classList.add('gap');return;}
  if(settings.boldSpeakers){const m=t.match(/^([A-Z][A-Z .'’-]{2,30}:)([\s\S]*)$/);if(m)p.innerHTML='<b class="spk">'+esc(m[1])+'</b>'+esc(m[2]);}
 });
 startAuto();lockScreen();};
const prevHome=renderHome;
renderHome=function(){prevHome();startAuto();lockScreen();};

/* ---------- settings drawer ---------- */
const FONTS=[['','Theme default'],["Georgia,'Times New Roman',serif",'Georgia'],["'Palatino Linotype',Palatino,'Book Antiqua',serif",'Palatino'],["Charter,'Bitstream Charter',Cambria,serif",'Charter'],["system-ui,-apple-system,'Segoe UI',sans-serif",'System sans'],["Verdana,Geneva,sans-serif",'Verdana (easy to read)'],["'Trebuchet MS',Arial,sans-serif",'Trebuchet'],["'Courier New',ui-monospace,monospace",'Typewriter']];
const UNITS={letterSpacing:'em',wordSpacing:'em',indent:'em',pad:'px',dim:'%',autoScroll:''};
const prevDrawer=openDrawer;
openDrawer=async function(){await prevDrawer();const d=$('.drawer');if(!d)return;
 const sel=$('#shelf-text-format');
 if(sel){if(![...sel.options].some(o=>o.value==='original'))sel.add(new Option('Original PDF gaps (keep spacing)','original'));sel.value=settings.textFormat||'preserve';}
 const th=$('#theme');
 if(th){[['amoled','AMOLED black'],['paper','Paper white'],['ocean','Ocean']].forEach(([v,l])=>th.add(new Option(l,v)));th.value=settings.theme;}
 const rng=(k,l,min,max,step)=>`<div class="setting"><label for="x-${k}">${l} <span id="x-${k}-v">${settings[k]}${UNITS[k]}</span></label><input id="x-${k}" type="range" min="${min}" max="${max}" step="${step}" value="${settings[k]}"></div>`;
 const tog=(k,l)=>`<div class="setting"><label for="x-${k}">${l}</label><select id="x-${k}" class="field"><option value="true">On</option><option value="false">Off</option></select></div>`;
 const box=document.createElement('div');
 box.innerHTML=`<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3 style="margin:0 0 10px">Fine-tune &amp; extras</h3>
 ${tog('splitSpeakers','New paragraph at each SPEAKER: label')}
 ${tog('boldSpeakers','Style speaker labels')}
 <div class="setting"><label for="x-font">Font family</label><select id="x-font" class="field">${FONTS.map(([v,l])=>`<option value="${esc(v)}">${l}</option>`).join('')}</select></div>
 ${rng('letterSpacing','Letter spacing',-0.02,0.15,0.005)}
 ${rng('wordSpacing','Word spacing',0,0.6,0.02)}
 ${rng('indent','First-line indent',0,3,0.25)}
 ${rng('pad','Side margins',0,80,2)}
 ${rng('dim','Text brightness',40,100,5)}
 <div class="setting"><label for="x-accent">Accent colour</label><div class="row"><input id="x-accent" type="color" value="${settings.accent||'#496b56'}" style="width:60px;height:42px;border:0;background:none"><button class="btn" id="x-accent-reset">Use theme colour</button></div></div>
 ${rng('autoScroll','Auto-scroll speed (0 = off)',0,10,1)}
 ${tog('wakeLock','Keep screen awake while reading')}
 <button class="btn" id="x-reset" style="width:100%;margin-top:6px">Reset these extras</button>`;
 d.append(box);
 ['letterSpacing','wordSpacing','indent','pad','dim','autoScroll'].forEach(k=>{const el=$('#x-'+k);
  el.oninput=async()=>{settings[k]=+el.value;$('#x-'+k+'-v').textContent=el.value+UNITS[k];await saveSettings();if(k==='autoScroll')startAuto();};});
 ['splitSpeakers','boldSpeakers','wakeLock'].forEach(k=>{const el=$('#x-'+k);el.value=String(!!settings[k]);
  el.onchange=async()=>{settings[k]=el.value==='true';await saveSettings();if(view==='reader'){renderReader();}lockScreen();};});
 $('#x-font').value=settings.fontStack||'';
 $('#x-font').onchange=async e=>{settings.fontStack=e.target.value;await saveSettings();};
 $('#x-accent').oninput=async e=>{settings.accent=e.target.value;await saveSettings();};
 $('#x-accent-reset').onclick=async()=>{settings.accent='';await saveSettings();};
 $('#x-reset').onclick=async()=>{Object.assign(settings,D);await saveSettings();$('#overlay')?.remove();if(view==='reader')renderReader();toast('Extras reset.');};
};
})();
