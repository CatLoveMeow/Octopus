<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<meta name="description" content="Shelf is a calm, private reading space and library for your books and reading wishlist.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Shelf — Your Private Reading Space & Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Shelf Modern Theme & Core Design System
   ========================================================================== */
:root {
  color-scheme: light;
  --bg: #f7f5f0;
  --bg-subtle: #eeece5;
  --panel: #ffffff;
  --panel-glass: rgba(255, 255, 255, 0.85);
  --text: #1d201d;
  --text-bright: #0c0e0c;
  --muted: #6b7268;
  --line: #e3e0d5;
  --line-strong: #c8c4b7;
  --accent: #2e6347;
  --accent-hover: #245039;
  --accent-ink: #ffffff;
  --accent-soft: #eaf2ed;
  --soft: #f0eee6;
  --shadow-sm: 0 2px 8px rgba(29, 32, 29, 0.04);
  --shadow: 0 12px 36px rgba(29, 32, 29, 0.08);
  --shadow-lg: 0 22px 60px rgba(29, 32, 29, 0.12);
  --radius-sm: 10px;
  --radius: 18px;
  --radius-lg: 26px;
  --font-ui: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --font-heading: "Outfit", "Plus Jakarta Sans", sans-serif;
  --reader-font: "Newsreader", Georgia, serif;
  --reader-size: 21px;
  --reader-line: 1.85;
  --reader-width: 740px;
  --reader-align: left;
  --reader-gap: 1.25em;
  --reader-hyphens: manual;
  --reader-letter-spacing: normal;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131614;
  --bg-subtle: #1a1e1b;
  --panel: #1e2320;
  --panel-glass: rgba(30, 35, 32, 0.85);
  --text: #e7eae5;
  --text-bright: #ffffff;
  --muted: #9aa297;
  --line: #2e3630;
  --line-strong: #404b43;
  --accent: #78be93;
  --accent-hover: #8fd0a8;
  --accent-ink: #0f1c14;
  --accent-soft: #1d2c22;
  --soft: #272f29;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 24px 65px rgba(0, 0, 0, 0.5);
}

[data-theme="sepia"] {
  color-scheme: light;
  --bg: #eee5d3;
  --bg-subtle: #e3d8c2;
  --panel: #fcf7ed;
  --panel-glass: rgba(252, 247, 237, 0.88);
  --text: #3c3022;
  --text-bright: #241c13;
  --muted: #82725e;
  --line: #dfd2bb;
  --line-strong: #caba9f;
  --accent: #8b5f39;
  --accent-hover: #754f2e;
  --accent-ink: #fffdf9;
  --accent-soft: #f4ecdc;
  --soft: #e8dcc6;
  --shadow-sm: 0 2px 8px rgba(60, 48, 34, 0.05);
  --shadow: 0 12px 36px rgba(60, 48, 34, 0.09);
  --shadow-lg: 0 22px 60px rgba(60, 48, 34, 0.14);
}

[data-theme="amoled"] {
  color-scheme: dark;
  --bg: #000000;
  --bg-subtle: #0c0d0c;
  --panel: #101211;
  --panel-glass: rgba(16, 18, 17, 0.9);
  --text: #ecefe9;
  --text-bright: #ffffff;
  --muted: #8c9489;
  --line: #222623;
  --line-strong: #333a34;
  --accent: #86d4a2;
  --accent-hover: #9ee0b6;
  --accent-ink: #000000;
  --accent-soft: #142419;
  --soft: #1b1f1c;
  --shadow-sm: none;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.8);
}

[data-theme="ocean"] {
  color-scheme: dark;
  --bg: #0c1622;
  --bg-subtle: #122030;
  --panel: #172739;
  --panel-glass: rgba(23, 39, 57, 0.88);
  --text: #e2edf7;
  --text-bright: #ffffff;
  --muted: #8ba5bb;
  --line: #243c54;
  --line-strong: #325170;
  --accent: #5bb2ec;
  --accent-hover: #7bc3f2;
  --accent-ink: #071928;
  --accent-soft: #1a354c;
  --soft: #1d3347;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow: 0 14px 40px rgba(3, 8, 14, 0.45);
  --shadow-lg: 0 24px 65px rgba(3, 8, 14, 0.6);
}

[data-theme="paper"] {
  color-scheme: light;
  --bg: #fcfcf9;
  --bg-subtle: #f4f4ee;
  --panel: #ffffff;
  --panel-glass: rgba(255, 255, 255, 0.92);
  --text: #1a1a18;
  --text-bright: #000000;
  --muted: #666660;
  --line: #e6e6dc;
  --line-strong: #cbcbc0;
  --accent: #335577;
  --accent-hover: #26425e;
  --accent-ink: #ffffff;
  --accent-soft: #edf3f8;
  --soft: #f0f0e8;
  --shadow-sm: 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.09);
}

[data-theme="espresso"] {
  color-scheme: dark;
  --bg: #181412;
  --bg-subtle: #221c19;
  --panel: #29221f;
  --panel-glass: rgba(41, 34, 31, 0.88);
  --text: #efeae5;
  --text-bright: #ffffff;
  --muted: #a6988f;
  --line: #3f3530;
  --line-strong: #544741;
  --accent: #dca376;
  --accent-hover: #e6b791;
  --accent-ink: #1e130c;
  --accent-soft: #38281d;
  --soft: #332b27;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 24px 65px rgba(0, 0, 0, 0.6);
}

/* ==========================================================================
   Base & Resets
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  transition: background-color 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: transparent;
  color: inherit;
}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

a {
  color: var(--accent);
  text-decoration: none;
}

img {
  max-width: 100%;
  display: block;
}

.hidden {
  display: none !important;
}

/* ==========================================================================
   Layout & Global Components
   ========================================================================== */
.app {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px clamp(18px, 4.5vw, 48px) 110px;
}

/* Header */
.top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-icon {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  background: linear-gradient(135deg, var(--accent), var(--accent-hover));
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.brand-icon svg {
  width: 26px;
  height: 26px;
  fill: currentColor;
}

.brand-wrap:hover .brand-icon {
  transform: rotate(-4deg) scale(1.05);
}

.brand-text h1 {
  font-family: var(--font-heading);
  font-size: 28px;
  font-weight: 750;
  margin: 0;
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.brand-text p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 16px;
  min-height: 42px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
  white-space: nowrap;
}

.btn:hover:not(:disabled) {
  background: var(--soft);
  border-color: var(--line-strong);
  transform: translateY(-1px);
}

.btn:active:not(:disabled) {
  transform: translateY(0);
}

.btn.primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
}

.btn.primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn.subtle {
  background: var(--soft);
  border-color: transparent;
  box-shadow: none;
}

.btn.subtle:hover:not(:disabled) {
  background: var(--line);
}

.btn.icon {
  width: 42px;
  min-width: 42px;
  padding: 0;
  font-size: 17px;
}

.btn.danger {
  color: #d9383a;
  border-color: rgba(217, 56, 58, 0.3);
}

.btn.danger:hover:not(:disabled) {
  background: rgba(217, 56, 58, 0.1);
  border-color: #d9383a;
}

/* Panels */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* Hero & Stats Dashboard */
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(260px, 1fr);
  gap: 20px;
  margin-bottom: 30px;
}

.continue-card {
  padding: 24px 28px;
  display: flex;
  gap: 24px;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.continue-card::before {
  content: "";
  position: absolute;
  top: -60px;
  right: -60px;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 15%, transparent), transparent 70%);
  pointer-events: none;
}

.continue-info {
  flex: 1;
  min-width: 0;
}

.continue-info h2 {
  font-family: var(--font-heading);
  font-size: 23px;
  font-weight: 700;
  margin: 8px 0 6px;
  line-height: 1.25;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 750;
  display: flex;
  align-items: center;
  gap: 6px;
}

.summary-card {
  padding: 24px 26px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin: 14px 0;
}

.stat-item {
  background: var(--soft);
  padding: 12px 14px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-item span {
  font-size: 12px;
  color: var(--muted);
  font-weight: 550;
}

.stat-item strong {
  font-family: var(--font-heading);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-bright);
}



.progress-bar-wrap {
  height: 6px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
  margin: 12px 0 6px;
}

.progress-bar-wrap i {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.3s ease;
}

/* Toolbar & Filter Bar */
.library-toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.search-box {
  flex: 1;
  min-width: 220px;
  position: relative;
}

.field {
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  color: var(--text);
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.field:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}

.tabs-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 22px;
  overflow-x: auto;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
}

.tab-btn {
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
}

.tab-btn:hover {
  color: var(--text);
  background: var(--soft);
}

.tab-btn.active {
  color: var(--text-bright);
  background: var(--soft);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
}

.tab-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 99px;
  background: var(--line);
  color: var(--muted);
}

.tab-btn.active .tab-badge {
  background: var(--accent);
  color: var(--accent-ink);
}

.view-subbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

/* ==========================================================================
   Book Cards & Covers (3D, Realistic & Crisp)
   ========================================================================== */
.books-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 28px 20px;
}

.book-card {
  position: relative;
  display: flex;
  flex-direction: column;
}

.book-card-btn {
  border: 0;
  padding: 0;
  text-align: left;
  color: inherit;
  width: 100%;
  display: flex;
  flex-direction: column;
}

/* Cover styling with 3D spine and realistic shadow */
.cover-container {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.16), 0 2px 6px rgba(0, 0, 0, 0.08);
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.4, 1), box-shadow 0.22s ease;
  overflow: hidden;
  background: #252b27;
}

.book-card-btn:hover .cover-container {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 18px 38px rgba(0, 0, 0, 0.22), 0 4px 10px rgba(0, 0, 0, 0.1);
}

/* Spine edge highlight and shadow */
.cover-container::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 10px;
  background: linear-gradient(to right, rgba(255,255,255,0.25), rgba(255,255,255,0.05) 30%, rgba(0,0,0,0.15) 70%, rgba(0,0,0,0.3) 100%);
  pointer-events: none;
  z-index: 2;
}

.cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cover-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 16px;
  color: #ffffff;
  position: relative;
  box-sizing: border-box;
}

.cover-fallback-title {
  font-family: var(--font-heading);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.25;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  word-break: break-word;
}

.cover-fallback-monogram {
  font-family: var(--font-heading);
  font-size: 34px;
  font-weight: 800;
  opacity: 0.9;
  text-align: center;
  margin: auto 0;
}

.cover-fallback-author {
  font-size: 11px;
  opacity: 0.85;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Cover Badges */
.card-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 3;
  padding: 3px 8px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(8px);
}

.badge-wishlist {
  background: rgba(224, 150, 48, 0.92);
  color: #ffffff;
}

.badge-reading {
  background: rgba(46, 99, 71, 0.92);
  color: #ffffff;
}

.badge-finished {
  background: rgba(72, 114, 158, 0.92);
  color: #ffffff;
}

.badge-fav {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 3;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  color: #d9383a;
  display: grid;
  place-items: center;
  font-size: 13px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.book-card-meta {
  margin-top: 10px;
}

.book-card-title {
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 14px;
  line-height: 1.35;
  color: var(--text-bright);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-card-author {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.book-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 6px;
  font-size: 11px;
  color: var(--muted);
}

.book-card-menu {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 4;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(18, 22, 19, 0.75);
  color: #ffffff;
  display: grid;
  place-items: center;
  font-size: 18px;
  backdrop-filter: blur(6px);
  transition: all 0.15s ease;
  opacity: 0;
}

.book-card:hover .book-card-menu {
  opacity: 1;
}

.book-card-menu:hover {
  background: rgba(18, 22, 19, 0.95);
  transform: scale(1.1);
}

/* List Layout */
.books-list-layout {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.books-list-layout .book-card {
  flex-direction: row;
  align-items: center;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}

.books-list-layout .book-card-btn {
  flex-direction: row;
  align-items: center;
  gap: 16px;
  flex: 1;
}

.books-list-layout .cover-container {
  width: 58px;
  min-width: 58px;
  aspect-ratio: 2 / 3;
}

.books-list-layout .book-card-meta {
  margin: 0;
  flex: 1;
}

.books-list-layout .book-card-menu {
  position: static;
  opacity: 1;
  background: var(--soft);
  color: var(--text);
  margin-left: 12px;
}

/* Empty State */
.empty-shelf {
  text-align: center;
  padding: 60px 24px;
  max-width: 480px;
  margin: 0 auto;
}

.empty-shelf-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.empty-shelf h2 {
  font-family: var(--font-heading);
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 8px;
}

.empty-shelf p {
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 24px;
}

/* ==========================================================================
   Book Detail Page
   ========================================================================== */
.detail-layout {
  max-width: 900px;
  margin: 0 auto;
}

.detail-card {
  padding: 32px;
  display: flex;
  gap: 32px;
  align-items: flex-start;
  margin-bottom: 30px;
}

.detail-cover {
  width: 190px;
  min-width: 190px;
  border-radius: 12px;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}

.detail-content {
  flex: 1;
  min-width: 0;
}

.detail-content h2 {
  font-family: var(--font-heading);
  font-size: 30px;
  font-weight: 750;
  line-height: 1.15;

<body>

<div id="root"></div>

<!-- Accessible Native Modals Container -->
<dialog id="modal-container" closedby="any"></dialog>
<div id="toast" class="shelf-toast hidden" role="status" aria-live="polite"></div>

<!-- Hidden File Input for Books -->
<input id="file-input" type="file" accept=".txt,.md,.text,.pdf,.epub,.json" multiple hidden>

<!-- Scripts: Local with CDN Fallback -->
<script>
async function loadLibrary(name, localSrc, cdnSrc) {
  if (window[name]) return window[name];
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = localSrc;
    s.onload = () => resolve(window[name]);
    s.onerror = () => {
      console.warn(`Local ${localSrc} failed, falling back to CDN`);
      const c = document.createElement('script');
      c.src = cdnSrc;
      c.onload = () => resolve(window[name]);
      c.onerror = () => {
        console.error(`Failed to load ${name}`);
        resolve(null);
      };
      document.head.appendChild(c);
    };
    document.head.appendChild(s);
  });
}
</script>

<script>
'use strict';

/* ==========================================================================
   Shelf App State & IndexedDB v2 Engine
   ========================================================================== */
const DB_NAME = 'shelf-db', DB_VERSION = 2;
let db = null;
let books = [];
let currentBook = null;
let chapters = [];
let chapterIndex = 0;
let view = 'home';
let libraryFilter = 'all'; // 'all', 'reading', 'planned', 'finished', 'favorites'
let librarySort = 'recent'; // 'recent', 'title', 'progress', 'author'
let libraryLayout = 'grid'; // 'grid', 'list'
let searchQuery = '';
let activeSpeech = null;
let speechRate = 1.0;
let pdfDoc = null;
let pdfCurrentPage = 1;
let pdfTotalPages = 1;
let pdfZoom = 1.25;
let pdfFilter = 'normal'; // 'normal', 'dark', 'sepia'
let pdfFitWidth = false;

// Default Settings
let settings = {
  theme: 'light',
  fontSize: 21,
  lineHeight: 1.85,
  width: 740,
  font: 'Newsreader',
  align: 'left',
  textFormat: 'preserve',
  paragraphGap: 1.25,
  readingSpeed: 230 // words per minute
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

function esc(v = '') {
  return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function safeText(v) {
  return String(v ?? '').replace(/\u0000/g, '').trim();
}

function id() {
  return 'b_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function toast(msg, actionText = null, actionCb = null) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionText && actionCb) {
    const b = document.createElement('button');
    b.textContent = actionText;
    b.style.cssText = 'text-decoration:underline;color:inherit;font-weight:750;margin-left:8px;';
    b.onclick = () => { actionCb(); el.classList.add('hidden'); };
    el.appendChild(b);
  }
  el.classList.remove('hidden');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.add('hidden'), 4000);
}

/* IndexedDB Management with 'files' Object Store */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = req.result;
      if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('chapters')) {
        const s = d.createObjectStore('chapters', { keyPath: 'key' });
        s.createIndex('bookId', 'bookId', { unique: false });
      }
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function reqPromise(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function getAll(store) {
  return reqPromise(db.transaction(store, 'readonly').objectStore(store).getAll());
}

async function put(store, val) {
  return reqPromise(db.transaction(store, 'readwrite').objectStore(store).put(val));
}

async function get(store, key) {
  return reqPromise(db.transaction(store, 'readonly').objectStore(store).get(key));
}

async function removeBook(bookId) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['books', 'chapters', 'files'], 'readwrite');
    tx.objectStore('books').delete(bookId);
    tx.objectStore('files').delete(bookId);
    const s = tx.objectStore('chapters');
    const idx = s.index('bookId');
    const req = idx.openCursor(IDBKeyRange.only(bookId));
    req.onsuccess = () => {
      const c = req.result;
      if (c) {
        c.delete();
        c.continue();
      }
    };
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function loadState() {
  books = (await getAll('books')).sort((a, b) => (b.lastRead || b.added) - (a.lastRead || a.added));
  const saved = await get('settings', 'main');
  if (saved?.value) settings = { ...settings, ...saved.value };
  applySettings();
}

function applySettings() {
  document.documentElement.dataset.theme = settings.theme || 'light';
  const root = document.documentElement.style;
  root.setProperty('--reader-size', settings.fontSize + 'px');
  root.setProperty('--reader-line', settings.lineHeight);
  root.setProperty('--reader-width', settings.width + 'px');
  root.setProperty('--reader-font', settings.font === 'Newsreader' ? '"Newsreader", Georgia, serif' :
                                   settings.font === 'Sans' ? '"Plus Jakarta Sans", system-ui, sans-serif' :
                                   settings.font === 'Mono' ? '"JetBrains Mono", monospace' :
                                   settings.font || 'Georgia, serif');
  root.setProperty('--reader-align', settings.align || 'left');
  root.setProperty('--reader-gap', (settings.paragraphGap ?? 1.25) + 'em');
  root.setProperty('--reader-hyphens', settings.hyphenation ? 'auto' : 'manual');
}

async function saveSettings() {
  await put('settings', { key: 'main', value: settings });
  applySettings();
}

/* ==========================================================================
   Advanced PDF Scanning & Text Extraction Engine
   ========================================================================== */

/**
 * Normalizes text, repairs hyphens across line breaks, and restores ligatures.
 */
function cleanExtractedString(str) {
  return str
    .replace(/\ufb01/g, 'fi')
    .replace(/\ufb02/g, 'fl')
    .replace(/\ufb00/g, 'ff')
    .replace(/\ufb03/g, 'ffi')
    .replace(/\ufb04/g, 'ffl')
    .replace(/\u00ad/g, '') // Soft hyphen
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201c\u201d]/g, '"')
    .replace(/\u00a0/g, ' ');
}

/**
 * Intelligent Multi-Column and Flowing Paragraph Extraction
 */
function pdfPageToText(items, pageWidth = 612, pageHeight = 792) {
  if (!items || !items.length) return '';

  const cleanItems = [];
  for (const it of items) {
    if (!it || typeof it.str !== 'string') continue;
    const str = cleanExtractedString(it.str);
    if (!str.trim()) continue;
    const tr = it.transform || [];
    const x = Number(tr[4] || 0);
    const y = Number(tr[5] || 0);
    const h = Number(it.height || Math.abs(tr[3] || 0) || 11);
    const w = Number(it.width || str.length * h * 0.5);

    // Skip running headers in top 5% and footers/page numbers in bottom 5%
    if (pageHeight > 0) {
      const topDist = pageHeight - y;
      if (topDist < pageHeight * 0.05 && /^\s*(\d+|[IVXLCDM]+|chapter|part)\s*$/i.test(str)) continue;
      if (y < pageHeight * 0.05 && /^\s*(\d+|[IVXLCDM]+)\s*$/i.test(str)) continue;
    }

    cleanItems.push({ x, y, width: w, height: h, text: str });
  }

  if (!cleanItems.length) return '';

  // Multi-column layout detection:
  // Check if items divide cleanly across a central vertical gutter
  let minX = Infinity, maxX = -Infinity;
  for (const it of cleanItems) {
    if (it.x < minX) minX = it.x;
    if (it.x + it.width > maxX) maxX = it.x + it.width;
  }
  const span = maxX - minX;

  let columns = [cleanItems];
  if (span > 340) {
    const midLeft = minX + span * 0.35;
    const midRight = minX + span * 0.65;
    let crossing = 0;
    for (const it of cleanItems) {
      if (it.x < midLeft && (it.x + it.width) > midRight) crossing++;
    }
    // If very few items span across the middle gutter, it is two columns!
    if (crossing < 4) {
      const col1 = cleanItems.filter(it => (it.x + it.width * 0.5) < (minX + span * 0.5));
      const col2 = cleanItems.filter(it => (it.x + it.width * 0.5) >= (minX + span * 0.5));
      if (col1.length > 5 && col2.length > 5) {
        columns = [col1, col2];
      }
    }
  }

  const columnTexts = [];

  for (const colItems of columns) {
    // Cluster into horizontal lines
    const rows = [];
    for (const it of colItems) {
      let row = rows.find(r => Math.abs(r.y - it.y) <= Math.max(3, it.height * 0.38));
      if (!row) {
        row = { y: it.y, height: it.height, items: [] };
        rows.push(row);
      }
      row.height = Math.max(row.height, it.height);
      row.items.push(it);
    }

    rows.sort((a, b) => b.y - a.y); // Top to bottom

    const lines = [];
    for (const row of rows) {
      row.items.sort((a, b) => a.x - b.x); // Left to right
      let line = '';
      let lastRight = null;
      for (const it of row.items) {
        if (line && lastRight !== null && (it.x - lastRight) > row.height * 0.18) {
          line += ' ';
        }
        line += it.text;
        lastRight = it.x + it.width;
      }
      line = line.replace(/[ \t]+/g, ' ').trim();
      if (line) lines.push({ y: row.y, height: row.height, text: line });
    }

    // Assemble lines into paragraphs with de-hyphenation
    let colText = '';
    for (let i = 0; i < lines.length; i++) {
      const curr = lines[i];
      const prev = lines[i - 1];

      if (i > 0) {
        const gap = prev.y - curr.y;
        const isNewPara = gap > Math.max(prev.height, curr.height) * 1.6 ||
                          (/[.!?]["')\]]?$/.test(prev.text) && gap > prev.height * 1.25);

        if (isNewPara) {
          colText += '\n\n';
        } else if (/[-—]$/.test(prev.text) && /^[a-z]/.test(curr.text)) {
          // De-hyphenate! Remove trailing hyphen and attach
          colText = colText.slice(0, -1);
        } else {
          colText += ' ';
        }
      }
      colText += curr.text;
    }

    if (colText.trim()) columnTexts.push(colText.trim());
  }

  return columnTexts.join('\n\n');
}

/**
 * Word count helper
 */
function wordCount(text = '') {
  return (text.match(/\b[\p{L}\p{N}'’-]+\b/gu) || []).length;
}

/**
 * Split raw book text into chapters
 */
function splitText(text) {
  const clean = text.replace(/\r\n?/g, '\n').replace(/\u0000/g, '').trim();
  if (!clean) return [];

  const lines = clean.split('\n');
  const starts = [];
  const re = /^\s*(chapter|book|part|prologue|epilogue|interlude|act|scene|preface)\s+([\wIVXLC0-9:.-]+.*)?$/i;

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim();
    if (re.test(l) && l.length < 90) starts.push(i);
  }

  if (starts.length >= 2) {
    const out = [];
    for (let k = 0; k < starts.length; k++) {
      const from = starts[k], to = starts[k + 1] ?? lines.length;
      const body = lines.slice(from + 1, to).join('\n').trim();
      if (body.length > 20) {
        out.push({ title: lines[from].trim(), text: body, wordCount: wordCount(body) });
      }
    }
    if (out.length >= 2) return out;
  }

  // Fallback: Split by comfortable reading parts (~2,400 words)
  const paragraphs = clean.split(/\n\s*\n/);
  const out = [];
  let batch = [], words = 0, n = 1;

  for (const p of paragraphs) {
    const wc = wordCount(p);
    if (batch.length && words + wc > 2400) {
      const text = batch.join('\n\n');
      out.push({ title: `Part ${n++}`, text, wordCount: words });
      batch = [];
      words = 0;
    }
    batch.push(p);
    words += wc;
  }

  if (batch.length) {
    const text = batch.join('\n\n');
    out.push({ title: out.length ? `Part ${n}` : 'Full Text', text, wordCount: words });
  }

  return out;
}

/* ==========================================================================
   Import Files Engine (PDF, Scanned PDF Fallback, EPUB, TXT, MD, JSON)
   ========================================================================== */
async function importFiles(filesList) {
  for (const f of filesList) {
    try {
      const ext = f.name.split('.').pop().toLowerCase();
      if (ext === 'json') {
        await restoreBackup(await f.text());
        continue;
      }

      let ch = [];
      let title = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();
      let author = 'Unknown author';
      let cover = '';
      let isScanned = false;
      let hasPdf = false;
      let pdfArrayBuffer = null;
      let totalPages = 0;

      if (['txt', 'md', 'text'].includes(ext)) {
        ch = splitText(await f.text());
      } else if (ext === 'pdf') {
        hasPdf = true;
        pdfArrayBuffer = await f.arrayBuffer();

        // Load PDF.js locally or CDN
        if (!window.pdfjsLib) {
          await loadLibrary('pdfjsLib', './pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
        }
        pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

        const pdf = await pdfjsLib.getDocument({ data: pdfArrayBuffer.slice(0) }).promise;
        totalPages = pdf.numPages;

        // Extract first page as high-res cover image automatically!
        try {
          const firstPage = await pdf.getPage(1);
          const viewport = firstPage.getViewport({ scale: 1.5 });
          const cvs = document.createElement('canvas');
          cvs.width = viewport.width;
          cvs.height = viewport.height;
          const ctx = cvs.getContext('2d');
          await firstPage.render({ canvasContext: ctx, viewport }).promise;
          cover = cvs.toDataURL('image/jpeg', 0.85);
        } catch (e) {
          console.warn('Could not extract PDF cover page', e);
        }

        // Extract text across pages
        const pageTexts = [];
        let extractedWordCount = 0;

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const vp = page.getViewport({ scale: 1.0 });
          const tc = await page.getTextContent();
          const pageText = pdfPageToText(tc.items, vp.width, vp.height);
          if (pageText) {
            pageTexts.push(pageText);
            extractedWordCount += wordCount(pageText);
          }
          if (i % 8 === 0) toast(`Processing PDF page ${i} of ${pdf.numPages}…`);
        }

        // CRITICAL CHECK: "IF NOT VALID TEXT THEN FIND ANOTHER WAY TO OPEN PDF"
        // If scanned or low selectable text, seamlessly switch to Visual PDF Viewer!
        if (extractedWordCount < 30 || pageTexts.length === 0) {
          isScanned = true;
          // Generate placeholder page chapters so the book works in library
          ch = [{
            title: `Visual PDF Document (${totalPages} pages)`,
            text: `This document contains ${totalPages} pages and is opened in the High-Fidelity Visual PDF Viewer.`,
            wordCount: totalPages * 250
          }];
          toast(`Scanned PDF detected! Ready in Visual PDF Reader.`);
        } else {
          ch = splitText(pageTexts.join('\n\n'));
        }
      } else if (ext === 'epub') {
        if (!window.JSZip) {
          await loadLibrary('JSZip', './jszip.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
        }
        const epubData = await parseEpub(await f.arrayBuffer());
        ch = epubData.chapters;
        if (epubData.title) title = epubData.title;
        if (epubData.author) author = epubData.author;
        if (epubData.cover) cover = epubData.cover;
      } else {
        throw Error('Unsupported file format. Please import EPUB, PDF, TXT, Markdown, or Shelf backup JSON.');
      }

      const newBook = await addBook({
        title,
        author,
        cover,
        chapters: ch,
        sourceName: f.name,
        isScanned,
        hasPdf,
        totalPages,
        pdfData: pdfArrayBuffer
      });

      toast(`Added “${title}” to your library.`);
    } catch (err) {
      console.error(err);
      toast(`${f.name}: ${err.message || 'Import failed'}`);
    }
  }
}

async function parseEpub(buf) {
  const zip = await JSZip.loadAsync(buf);
  const parser = new DOMParser();
  const read = async p => { const f = zip.file(p); return f ? f.async('string') : ''; };
  const xml = t => parser.parseFromString(t, 'application/xml');

  const container = xml(await read('META-INF/container.xml'));
  const rootfile = container.querySelector('rootfile')?.getAttribute('full-path');
  if (!rootfile) throw Error('EPUB package file not found.');

  const opf = xml(await read(rootfile));
  const base = rootfile.slice(0, rootfile.lastIndexOf('/') + 1);

  // Metadata: Title, Author
  const title = opf.querySelector('metadata > title, metadata > dc\\:title')?.textContent?.trim() || '';
  const author = opf.querySelector('metadata > creator, metadata > dc\\:creator')?.textContent?.trim() || '';

  // Extract Cover Artwork
  let cover = '';
  try {
    const coverItem = opf.querySelector('manifest item[properties*="cover-image"]') ||
                      opf.querySelector('manifest item[id*="cover"]');
    if (coverItem) {
      const coverHref = decodeURIComponent(coverItem.getAttribute('href') || '').split('#')[0];
      const imgPath = normalizePath(base + coverHref);
      const imgFile = zip.file(imgPath);
      if (imgFile) {
        const b64 = await imgFile.async('base64');
        const mime = coverItem.getAttribute('media-type') || 'image/jpeg';
        cover = `data:${mime};base64,${b64}`;
      }
    }
  } catch (e) {
    console.warn('Cover extraction note:', e);
  }

  const manifest = new Map();
  opf.querySelectorAll('manifest item').forEach(i => manifest.set(i.getAttribute('id'), i));
  const spine = [...opf.querySelectorAll('spine itemref')];
  const chapters = [];

  for (const ref of spine) {
    const item = manifest.get(ref.getAttribute('idref'));
    if (!item) continue;
    const href = decodeURIComponent(item.getAttribute('href') || '').split('#')[0];
    const path = normalizePath(base + href);
    const raw = await read(path);
    if (!raw) continue;

    const doc = parser.parseFromString(raw, 'text/html');
    doc.querySelectorAll('script, style, nav, svg, iframe, object, header, footer').forEach(n => n.remove());

    const heading = doc.querySelector('h1, h2, h3')?.textContent?.trim() || `Chapter ${chapters.length + 1}`;
    const paragraphs = [...doc.querySelectorAll('h1, h2, h3, h4, p, blockquote, li')]
      .filter(n => !n.parentElement.closest('li'))
      .map(n => n.textContent.replace(/\s+/g, ' ').trim())
      .filter(Boolean);

    const text = paragraphs.join('\n\n');
    if (text.length > 25) {
      chapters.push({ title: heading, text, wordCount: wordCount(text) });
    }
  }

  if (!chapters.length) throw Error('No readable chapters found in this EPUB.');
  return { title, author, cover, chapters };
}

function normalizePath(path) {
  const a = [];
  for (const p of path.split('/')) {
    if (p === '..') a.pop();
    else if (p && p !== '.') a.push(p);
  }
  return a.join('/');
}

/* Add Book into IndexedDB */
async function addBook({
  title,
  author = '',
  cover = '',
  chapters: ch = [],
  sourceName = '',
  isPlanned = false,
  isScanned = false,
  hasPdf = false,
  totalPages = 0,
  pdfData = null,
  priority = 'up-next',
  targetDate = '',
  notes = '',
  tags = []
}) {
  const bookId = id();
  const totalWords = ch.reduce((n, c) => n + (c.wordCount || wordCount(c.text)), 0);

  const b = {
    id: bookId,
    title: safeText(title) || 'Untitled',
    author: safeText(author) || 'Unknown author',
    cover: cover || '',
    color: ['#2e6347', '#335577', '#8b5f39', '#5a3d72', '#2f6d6b', '#9b4d32'][Math.floor(Math.random() * 6)],
    sourceName,
    added: Date.now(),
    lastRead: 0,
    chapterIndex: 0,
    position: 0,
    progress: 0,
    totalWords,
    chapterCount: ch.length,
    finished: false,
    favorite: false,
    isPlanned,
    isScanned,
    hasPdf,
    totalPages,
    priority,
    targetDate,
    notes,
    tags: tags || []
  };

  const tx = db.transaction(['books', 'chapters', 'files'], 'readwrite');
  tx.objectStore('books').put(b);

  if (pdfData && hasPdf) {
    tx.objectStore('files').put({ id: bookId, data: pdfData, type: 'pdf' });
  }

  ch.forEach((c, i) => {
    tx.objectStore('chapters').put({
      key: bookId + '_' + i,
      bookId,
      index: i,
      data: {
        title: safeText(c.title) || `Chapter ${i + 1}`,
        text: c.text,
        wordCount: c.wordCount || wordCount(c.text)
      }
    });
  });

  await new Promise((resolve, reject) => {
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });

  books.unshift(b);
  renderHome();
  return b;
}

/**
 * Draws a high-resolution 600x900 book cover onto a canvas
 */
function drawCoverCanvas(canvas, config) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = 600;
  const h = canvas.height = 900;

  // Background
  if (config.bgType === 'image' && config.imgObj) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    const img = config.imgObj;
    const zoom = config.zoom || 1.0;
    const yOff = (config.yOffset || 50) / 100;

    const scale = Math.max(w / img.width, h / img.height) * zoom;
    const sw = img.width * scale;
    const sh = img.height * scale;
    const sx = (w - sw) / 2;
    const sy = (h - sh) * yOff;

    ctx.drawImage(img, sx, sy, sw, sh);

    // Dim overlay
    const dim = (config.dim ?? 40) / 100;
    ctx.fillStyle = `rgba(0, 0, 0, ${dim})`;
    ctx.fillRect(0, 0, w, h);
  } else {
    // Gradient Background
    const rad = ((config.angle || 135) * Math.PI) / 180;
    const x1 = w / 2 - Math.cos(rad) * w / 2;
    const y1 = h / 2 - Math.sin(rad) * h / 2;
    const x2 = w / 2 + Math.cos(rad) * w / 2;
    const y2 = h / 2 + Math.sin(rad) * h / 2;

    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, config.bg1 || '#1b3b2b');
    grad.addColorStop(1, config.bg2 || '#0b1d14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  }

  // Realistic Book Spine Lighting
  const spineGrad = ctx.createLinearGradient(0, 0, 45, 0);
  spineGrad.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
  spineGrad.addColorStop(0.25, 'rgba(255, 255, 255, 0.04)');
  spineGrad.addColorStop(0.6, 'rgba(0, 0, 0, 0.12)');
  spineGrad.addColorStop(1, 'rgba(0, 0, 0, 0.45)');
  ctx.fillStyle = spineGrad;
  ctx.fillRect(0, 0, 45, h);

  // Decorative Frame / Border
  if (config.frame !== 'none') {
    ctx.save();
    ctx.strokeStyle = config.accent || '#e8c766';
    ctx.lineWidth = config.frame === 'double' ? 2 : 3;

    const inset = 36;
    ctx.strokeRect(inset, inset, w - inset * 2, h - inset * 2);

    if (config.frame === 'double') {
      ctx.lineWidth = 1;
      ctx.strokeRect(inset + 8, inset + 8, w - (inset + 8) * 2, h - (inset + 8) * 2);
    }
    ctx.restore();
  }

  // Icon / Emblem in Center
  if (config.showEmblem !== false) {
    ctx.save();
    const emblemY = config.titlePos === 'top' ? 440 : 250;

    // Draw Emblem circle
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.arc(w / 2, emblemY, 56, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = config.accent || '#e8c766';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Icon or Monogram
    ctx.font = '54px "Newsreader", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = config.accent || '#e8c766';
    ctx.fillText(config.icon || '📖', w / 2, emblemY + 2);
    ctx.restore();
  }

  // Typography: Title & Author
  ctx.save();
  ctx.textAlign = 'center';
  const textColor = config.textColor || '#ffffff';
  ctx.fillStyle = textColor;
  ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
  ctx.shadowBlur = 8;

  // Title
  const titleFont = config.font === 'Outfit' ? 'bold 44px "Outfit", sans-serif' :
                    config.font === 'Mono' ? 'bold 36px "JetBrains Mono", monospace' :
                    'bold 46px "Newsreader", serif';
  ctx.font = titleFont;

  const titleY = config.titlePos === 'top' ? 180 :
                 config.titlePos === 'center' ? 460 : 620;

  // Word-wrap title
  const words = (config.title || 'Untitled Book').split(' ');
  const lines = [];
  let curLine = '';
  for (const word of words) {
    const test = curLine ? curLine + ' ' + word : word;
    if (ctx.measureText(test).width > w - 120 && curLine) {
      lines.push(curLine);
      curLine = word;
    } else {
      curLine = test;
    }
  }
  if (curLine) lines.push(curLine);

  const lineHeight = 54;
  const startY = titleY - ((lines.length - 1) * lineHeight) / 2;
  lines.forEach((line, idx) => {
    ctx.fillText(line, w / 2, startY + idx * lineHeight);
  });

  // Author
  ctx.font = '600 22px "Plus Jakarta Sans", sans-serif';
  ctx.letterSpacing = '2px';
  ctx.fillStyle = config.accent || '#e8c766';
  const authorY = config.titlePos === 'top' ? startY + lines.length * lineHeight + 20 : 800;
  ctx.fillText((config.author || 'UNKNOWN AUTHOR').toUpperCase(), w / 2, authorY);

  // Ribbon / Badge (e.g. Want to Read, Classic, etc.)
  if (config.badge) {
    ctx.fillStyle = config.accent || '#e8c766';
    ctx.beginPath();
    ctx.roundRect(w / 2 - 80, 56, 160, 32, 99);
    ctx.fill();

    ctx.font = 'bold 12px "Plus Jakarta Sans", sans-serif';
    ctx.fillStyle = '#0f1712';
    ctx.shadowBlur = 0;
    ctx.fillText(config.badge.toUpperCase(), w / 2, 77);
  }

  ctx.restore();
}

let isNavigatingFromHistory = false;

function setView(newView, params = {}) {
  view = newView;
  if (!isNavigatingFromHistory) {
    let hash = '#library';
    if (newView === 'detail' && params.bookId) hash = `#book-${params.bookId}`;
    else if (newView === 'reader' && params.bookId) hash = `#reader-${params.bookId}`;

    const cur = history.state;
    if (!cur || cur.view !== newView || cur.bookId !== params.bookId || cur.chapterIndex !== params.chapterIndex) {
      history.pushState({ view: newView, ...params }, '', hash);
    }
  }
}

/* Link book file to an existing planned wishlist book */
async function linkFileToPlannedBook(plannedBook, file) {
  try {
    toast(`Reading ${file.name}…`);
    const ext = file.name.split('.').pop().toLowerCase();
    let ch = [];
    let isScanned = false;
    let hasPdf = false;
    let pdfBuf = null;
    let totalPages = 0;

    if (['txt', 'md', 'text'].includes(ext)) {
      ch = splitText(await file.text());
    } else if (ext === 'pdf') {
      hasPdf = true;
      pdfBuf = await file.arrayBuffer();
      if (!window.pdfjsLib) {
        await loadLibrary('pdfjsLib', './pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({ data: pdfBuf.slice(0) }).promise;
      totalPages = pdf.numPages;

      const pageTexts = [];
      let totalW = 0;
      for (let i = 1; i <= pdf.numPages; i++) {
        const p = await pdf.getPage(i);
        const vp = p.getViewport({ scale: 1.0 });
        const tc = await p.getTextContent();
        const pt = pdfPageToText(tc.items, vp.width, vp.height);
        if (pt) { pageTexts.push(pt); totalW += wordCount(pt); }
      }

      if (totalW < 30) {
        isScanned = true;
        ch = [{ title: `Visual PDF (${totalPages} pages)`, text: 'Visual PDF Document', wordCount: totalPages * 250 }];
      } else {
        ch = splitText(pageTexts.join('\n\n'));
      }
    } else if (ext === 'epub') {
      if (!window.JSZip) {
        await loadLibrary('JSZip', './jszip.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
      }
      const ep = await parseEpub(await file.arrayBuffer());
      ch = ep.chapters;
    }

    if (!ch.length) throw Error('Could not extract readable content from that file.');

    // Update planned book
    plannedBook.isPlanned = false;
    plannedBook.isScanned = isScanned;
    plannedBook.hasPdf = hasPdf;
    plannedBook.totalPages = totalPages;
    plannedBook.chapterCount = ch.length;
    plannedBook.totalWords = ch.reduce((n, c) => n + c.wordCount, 0);

    const tx = db.transaction(['books', 'chapters', 'files'], 'readwrite');
    tx.objectStore('books').put(plannedBook);
    if (pdfBuf && hasPdf) {
      tx.objectStore('files').put({ id: plannedBook.id, data: pdfBuf, type: 'pdf' });
    }
    ch.forEach((c, i) => {
      tx.objectStore('chapters').put({
        key: plannedBook.id + '_' + i,
        bookId: plannedBook.id,
        index: i,
        data: c
      });
    });

    await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });

    toast(`Successfully linked file! “${plannedBook.title}” is ready to read.`);
    await renderDetail(plannedBook);
  } catch (e) {
    console.error(e);
    toast(`Failed to link file: ${e.message}`);
  }
}

/* ==========================================================================
   Reader Engine: Text Reader & High-Fidelity Visual PDF Engine
   ========================================================================== */
async function openBook(bookId, chIdx = null) {
  const b = books.find(x => x.id === bookId);
  if (!b) return;

  currentBook = b;
  chapterIndex = Math.max(0, chIdx ?? b.chapterIndex ?? 0);
  setView('reader', { bookId: b.id, chapterIndex });
  view = 'reader';

  // Load chapters
  const allCh = await getAll('chapters');
  chapters = allCh.filter(c => c.bookId === bookId).sort((a, b) => a.index - b.index).map(c => c.data);

  b.lastRead = Date.now();
  await put('books', b);

  // If the book is a scanned PDF (or user prefers Visual PDF), open Visual PDF mode directly!
  if (b.isScanned || (b.hasPdf && b.viewerMode === 'pdf')) {
    await renderVisualPdfViewer();
  } else {
    renderTextReader();
  }
}

function renderTextReader() {
  const b = currentBook;
  const c = chapters[chapterIndex] || { title: 'Chapter', text: '' };
  const root = $('#root');

  root.innerHTML = `
    <header class="reader-header">
      <button class="btn icon" data-action="home" aria-label="Back to Library" title="Library">←</button>
      <div class="reader-header-title">${esc(b.title)} · ${esc(c.title)}</div>

      ${b.hasPdf ? `
        <div class="reader-mode-toggle">
          <button class="active">Text</button>
          <button id="btn-switch-pdf">PDF Canvas</button>
        </div>
      ` : ''}

      <div style="display:flex; gap:6px;">
        <button class="btn icon" id="btn-reader-toc" title="Table of Contents">☷</button>
        <button class="btn icon" id="btn-reader-settings" title="Text Styling">Aa</button>
      </div>
    </header>

    <div class="reading-progress-track"><i id="read-progress-bar"></i></div>

    <article class="reader-container" id="reader-body">
      <h2>${esc(c.title)}</h2>
      ${c.text.split(/\n\s*\n/).map((p, idx) => `
        <p data-p="${idx}">${esc(p.trim())}</p>
      `).join('')}
    </article>

    <!-- Floating Bottom Controls Pill -->
    <nav class="reader-floating-pill" aria-label="Reader Navigation">
      <button class="btn" id="btn-prev-ch" ${chapterIndex === 0 ? 'disabled' : ''} title="Previous Chapter">‹</button>
      <div class="pos-info">Ch. ${chapterIndex + 1} / ${chapters.length}</div>
      <button class="btn" id="btn-next-ch" ${chapterIndex >= chapters.length - 1 ? 'disabled' : ''} title="Next Chapter">›</button>
      <div style="width:1px; height:18px; background:var(--line); margin:0 4px;"></div>
      <button class="btn" id="btn-speak" title="Read Aloud">${activeSpeech ? '⏸ Stop' : '🔊 Listen'}</button>
      <button class="btn" id="btn-search-in-book" title="Search Book">🔍</button>
      <button class="btn" id="btn-fullscreen" title="Fullscreen">⛶</button>
    </nav>
  `;

  // Restore scroll anchor
  const savedAnchor = b.anchor?.chapter === chapterIndex ? b.anchor?.paragraph : 0;
  if (savedAnchor) {
    const el = $(`p[data-p="${savedAnchor}"]`);
    el?.scrollIntoView({ block: 'center' });
  } else {
    window.scrollTo(0, 0);
  }

  // Progress update on scroll
  const onScroll = () => {
    const el = $('#reader-body');
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const scrollMax = el.scrollHeight - window.innerHeight;
    const p = Math.max(0, Math.min(1, (-rect.top + 80) / Math.max(1, scrollMax)));

    $('#read-progress-bar').style.width = (p * 100) + '%';

    // Find nearest paragraph
    const ps = $$('p[data-p]', el);
    let nearest = 0;
    for (let i = 0; i < ps.length; i++) {
      if (ps[i].getBoundingClientRect().top < window.innerHeight * 0.4) nearest = i;
    }

    b.anchor = { chapter: chapterIndex, paragraph: nearest };
    b.chapterIndex = chapterIndex;
    b.position = p;
    b.progress = Math.round(((chapterIndex + p) / Math.max(1, chapters.length)) * 100);

    put('books', b);
  };

  window.onscroll = throttle(onScroll, 200);
  requestAnimationFrame(onScroll);

  // Attach Listeners
  $('#btn-prev-ch').onclick = () => moveChapter(-1);
  $('#btn-next-ch').onclick = () => moveChapter(1);
  $('#btn-speak').onclick = () => toggleSpeech();
  $('#btn-reader-toc').onclick = () => showTocModal();
  $('#btn-reader-settings').onclick = () => showSettingsModal();
  $('#btn-search-in-book').onclick = () => showSearchInBookModal();
  $('#btn-fullscreen').onclick = () => toggleFullscreen();

  $('#btn-switch-pdf')?.addEventListener('click', async () => {
    b.viewerMode = 'pdf';
    await put('books', b);
    await renderVisualPdfViewer();
  });
}

/* ==========================================================================
   Visual PDF Viewer (For Scanned PDFs and High-Fidelity Viewing)
   ========================================================================== */
async function renderVisualPdfViewer() {
  const b = currentBook;
  const root = $('#root');

  root.innerHTML = `
    <header class="reader-header">
      <button class="btn icon" data-action="home" aria-label="Back to Library" title="Library">←</button>
      <div class="reader-header-title">${esc(b.title)} · Visual PDF Viewer</div>

      ${!b.isScanned ? `
        <div class="reader-mode-toggle">
          <button id="btn-switch-text">Text</button>
          <button class="active">PDF Canvas</button>
        </div>
      ` : ''}

      <div style="display:flex; gap:6px;">
        <button class="btn icon" id="btn-pdf-filter" title="Toggle Night Filter">🌙</button>
        <button class="btn icon" id="btn-fullscreen" title="Fullscreen">⛶</button>
      </div>
    </header>

    <div class="pdf-viewer-wrap">
      <!-- Toolbar -->
      <div class="pdf-toolbar">
        <button class="btn" id="btn-pdf-prev">‹ Previous Page</button>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="number" id="inp-pdf-page" min="1" max="${b.totalPages || 100}" value="${b.lastPdfPage || 1}" style="width:60px; text-align:center; padding:6px; border:1px solid var(--line); border-radius:8px;">
          <span class="muted">/ <span id="lbl-pdf-total">${b.totalPages || 1}</span></span>
        </div>
        <button class="btn" id="btn-pdf-next">Next Page ›</button>
        <div style="width:1px; height:20px; background:var(--line); margin:0 4px;"></div>
        <button class="btn icon" id="btn-pdf-zoom-out" title="Zoom out">-</button>
        <span class="muted" id="lbl-pdf-zoom" style="font-size:13px; font-weight:600;">${Math.round(pdfZoom * 100)}%</span>
        <button class="btn icon" id="btn-pdf-zoom-in" title="Zoom in">+</button>
        <button class="btn" id="btn-pdf-fit">Fit Width</button>
      </div>

      <!-- Canvas Container -->
      <div class="pdf-canvas-container ${pdfFilter === 'dark' ? 'pdf-filter-dark' : pdfFilter === 'sepia' ? 'pdf-filter-sepia' : ''}" id="pdf-container">
        <canvas id="pdf-render-canvas"></canvas>
      </div>
    </div>
  `;

  // Load PDF file from IndexedDB
  const fileObj = await get('files', b.id);
  if (!fileObj || !fileObj.data) {
    toast('PDF document data not found on this device.');
    return;
  }

  if (!window.pdfjsLib) {
    await loadLibrary('pdfjsLib', './pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

  pdfDoc = await pdfjsLib.getDocument({ data: fileObj.data.slice(0) }).promise;
  pdfTotalPages = pdfDoc.numPages;
  $('#lbl-pdf-total').textContent = pdfTotalPages;
  pdfCurrentPage = Math.max(1, Math.min(pdfTotalPages, b.lastPdfPage || 1));

  await drawPdfCurrentPage();

  // PDF Navigation Listeners
  $('#btn-pdf-prev').onclick = async () => {
    if (pdfCurrentPage > 1) {
      pdfCurrentPage--;
      await drawPdfCurrentPage();
    }
  };

  $('#btn-pdf-next').onclick = async () => {
    if (pdfCurrentPage < pdfTotalPages) {
      pdfCurrentPage++;
      await drawPdfCurrentPage();
    }
  };

  $('#inp-pdf-page').onchange = async (e) => {
    const val = Number(e.target.value);
    if (val >= 1 && val <= pdfTotalPages) {
      pdfCurrentPage = val;
      await drawPdfCurrentPage();
    }
  };

  $('#btn-pdf-zoom-in').onclick = async () => {
    pdfZoom = Math.min(3.0, pdfZoom + 0.2);
    $('#lbl-pdf-zoom').textContent = Math.round(pdfZoom * 100) + '%';
    await drawPdfCurrentPage();
  };

  $('#btn-pdf-zoom-out').onclick = async () => {
    pdfZoom = Math.max(0.6, pdfZoom - 0.2);
    $('#lbl-pdf-zoom').textContent = Math.round(pdfZoom * 100) + '%';
    await drawPdfCurrentPage();
  };

  $('#btn-pdf-fit').onclick = async () => {
    pdfFitWidth = !pdfFitWidth;
    $('#btn-pdf-fit').textContent = pdfFitWidth ? 'Reset Zoom' : 'Fit Width';
    await drawPdfCurrentPage();
  };

  $('#btn-pdf-filter').onclick = () => {
    pdfFilter = pdfFilter === 'normal' ? 'dark' : pdfFilter === 'dark' ? 'sepia' : 'normal';
    const c = $('#pdf-container');
    c.className = `pdf-canvas-container ${pdfFilter === 'dark' ? 'pdf-filter-dark' : pdfFilter === 'sepia' ? 'pdf-filter-sepia' : ''}`;
    toast(`PDF filter: ${pdfFilter}`);
  };

  $('#btn-switch-text')?.addEventListener('click', async () => {
    b.viewerMode = 'text';
    await put('books', b);
    renderTextReader();
  });

  $('#btn-fullscreen').onclick = () => toggleFullscreen();
}

async function drawPdfCurrentPage() {
  if (!pdfDoc) return;
  const page = await pdfDoc.getPage(pdfCurrentPage);
  const canvas = $('#pdf-render-canvas');
  if (!canvas) return;

  const containerWidth = $('#pdf-container').clientWidth - 32;
  const baseViewport = page.getViewport({ scale: 1.0 });

  let scale = pdfZoom;
  if (pdfFitWidth) {
    scale = containerWidth / baseViewport.width;
  }

  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const viewport = page.getViewport({ scale });

  canvas.width = Math.floor(viewport.width * dpr);
  canvas.height = Math.floor(viewport.height * dpr);
  canvas.style.width = Math.floor(viewport.width) + 'px';
  canvas.style.height = Math.floor(viewport.height) + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  await page.render({ canvasContext: ctx, viewport }).promise;

  $('#inp-pdf-page').value = pdfCurrentPage;

  // Save reading progress
  currentBook.lastPdfPage = pdfCurrentPage;
  currentBook.progress = Math.round((pdfCurrentPage / pdfTotalPages) * 100);
  await put('books', currentBook);
}

/* ==========================================================================
   Reader Controls, TTS, and Fullscreen
   ========================================================================== */
async function moveChapter(delta) {
  stopSpeech();
  const next = chapterIndex + delta;
  if (next < 0 || next >= chapters.length) return;

  chapterIndex = next;
  currentBook.chapterIndex = next;
  currentBook.anchor = null;
  await put('books', currentBook);
  renderTextReader();
  window.scrollTo(0, 0);
}

function stopSpeech() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  activeSpeech = null;
  const b = $('#btn-speak');
  if (b) b.textContent = '🔊 Listen';
  $$('.speaking').forEach(el => el.classList.remove('speaking'));
}

function toggleSpeech() {
  if (!('speechSynthesis' in window)) {
    toast('Text-to-speech is not supported in this browser.');
    return;
  }
  if (activeSpeech) {
    stopSpeech();
    return;
  }

  const ps = $$('#reader-body p[data-p]');
  let i = currentBook.anchor?.paragraph || 0;
  activeSpeech = true;
  $('#btn-speak').textContent = '⏸ Stop';

  function speakNext() {
    if (!activeSpeech || i >= ps.length) {
      stopSpeech();
      return;
    }
    $$('.speaking').forEach(el => el.classList.remove('speaking'));
    const p = ps[i++];
    p.classList.add('speaking');
    p.scrollIntoView({ block: 'center', behavior: 'smooth' });

    const u = new SpeechSynthesisUtterance(p.textContent);
    u.rate = speechRate;
    u.onend = speakNext;
    u.onerror = () => stopSpeech();
    speechSynthesis.speak(u);
  }

  speakNext();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

function throttle(fn, ms) {
  let last = 0, timer;
  return () => {
    const now = Date.now();
    if (now - last >= ms) {
      last = now;
      fn();
    } else {
      clearTimeout(timer);
      timer = setTimeout(() => { last = Date.now(); fn(); }, ms - (now - last));
    }
  };
}

/* ==========================================================================
   Accessible Modals (Native <dialog>, Zero prompt() / confirm())
   ========================================================================== */
const modal = $('#modal-container');

function showModal(contentHTML) {
  modal.innerHTML = `<div class="modal-sheet">${contentHTML}</div>`;
  modal.showModal();
  history.pushState({ modalOpen: true }, '', location.hash);
  modalPushed = true;

  // Close when clicking backdrop
  modal.onclick = (e) => {
    const sheet = modal.querySelector('.modal-sheet');
    if (!sheet) return;
    const rect = sheet.getBoundingClientRect();
    const outside = e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom;
    if (outside) closeModal();
  };
}

function closeModal() {
  if (!modal.open) return;
  modal.close();
  if (modalPushed) {
    modalPushed = false;
    if (history.state?.modalOpen) {
      history.back();
    }
  }
}

        Export a JSON backup to keep your library secure or transfer to another device.
      </p>

      <button class="btn primary" id="btn-export-backup" style="width:100%;margin-bottom:8px;">
        📥 Export Full Library JSON Backup
      </button>

      <label class="btn" style="width:100%;text-align:center;">
        📤 Restore Library from Backup JSON
        <input type="file" id="inp-restore-file" accept=".json" hidden>
      </label>

      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Close</button>
      </div>
    </div>
  `);

  $('#btn-export-backup').onclick = async () => {
    const allBooks = await getAll('books');
    const allChapters = await getAll('chapters');
    const allSettings = await getAll('settings');

    const backupData = {
      app: 'Shelf',
      version: 2,
      createdAt: new Date().toISOString(),
      books: allBooks,
      chapters: allChapters,
      settings: allSettings
    };

    downloadBlob(new Blob([JSON.stringify(backupData)], { type: 'application/json' }), `shelf-library-${new Date().toISOString().slice(0, 10)}.json`);
    toast('Library backup exported successfully.');
  };

  $('#inp-restore-file').onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      await restoreBackup(await file.text());
      closeModal();
    } catch (err) {
      toast('Failed to restore backup: ' + err.message);
    }
  };
}

async function restoreBackup(jsonText) {
  const data = JSON.parse(jsonText);
  if (!data.books || !data.chapters) throw Error('Invalid Shelf backup format.');

  const tx = db.transaction(['books', 'chapters', 'settings'], 'readwrite');
  for (const b of data.books) tx.objectStore('books').put(b);
  for (const c of data.chapters) tx.objectStore('chapters').put(c);
  for (const s of (data.settings || [])) tx.objectStore('settings').put(s);

  await new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  await loadState();
  renderHome();
  toast(`Restored ${data.books.length} books into your library.`);
}

/* Table of Contents Modal */
function showTocModal() {
  showModal(`
    <div class="modal-header">
      <h2>Table of Contents</h2>
      <button class="btn icon" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" style="max-height:400px;overflow-y:auto;">
      ${chapters.map((ch, idx) => `
        <button class="chapter-item-btn ${idx === chapterIndex ? 'active' : ''}" data-ch="${idx}" style="border-radius:8px;margin-bottom:4px;">
          <span>${esc(ch.title)}</span>
          <span class="muted" style="font-size:12px;">${idx + 1}</span>
        </button>
      `).join('')}
    </div>
  `);

  $$('.modal-body button[data-ch]').forEach(btn => {
    btn.onclick = () => {
      chapterIndex = Number(btn.dataset.ch);
      closeModal();
      renderTextReader();
      window.scrollTo(0, 0);
    };
  });
}

/* Search Inside Book Modal */
function showSearchInBookModal() {
  showModal(`
    <div class="modal-header">
      <h2>🔍 Search in Book</h2>
      <button class="btn icon" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <input id="inp-search-term" class="field" placeholder="Type words or phrase to search…" autofocus>
      <div id="search-results-list" style="max-height:350px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-top:10px;"></div>
    </div>
  `);

  $('#inp-search-term').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    const list = $('#search-results-list');
    if (!q || q.length < 2) {
      list.innerHTML = '';
      return;
    }

    const matches = [];
    chapters.forEach((ch, chIdx) => {
      const idx = ch.text.toLowerCase().indexOf(q);
      if (idx !== -1) {
        const start = Math.max(0, idx - 45);
        const end = Math.min(ch.text.length, idx + q.length + 65);
        const snippet = ch.text.slice(start, end).replace(/\s+/g, ' ');
        matches.push({ chIdx, title: ch.title, snippet });
      }
    });

    if (!matches.length) {
      list.innerHTML = `<div class="muted" style="text-align:center;padding:20px;">No occurrences found.</div>`;
      return;
    }

    list.innerHTML = matches.map(m => `
      <button class="chapter-item-btn" data-ch="${m.chIdx}" style="border:1px solid var(--line);border-radius:10px;flex-direction:column;align-items:flex-start;gap:4px;">
        <strong style="font-size:13px;color:var(--accent);">${esc(m.title)}</strong>
        <span style="font-size:13px;color:var(--text);">${esc(m.snippet)}</span>
      </button>
    `).join('');

    $$('#search-results-list button[data-ch]').forEach(btn => {
      btn.onclick = () => {
        chapterIndex = Number(btn.dataset.ch);
        closeModal();
        renderTextReader();
      };
    });
  };
}

/* Delete Book with Undo */
function deleteBookWithPrompt(bookId) {
  const b = books.find(x => x.id === bookId);
  if (!b) return;

  showModal(`
    <div class="modal-header">
      <h2>Remove Book?</h2>
      <button class="btn icon" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to remove <strong>“${esc(b.title)}”</strong> and all associated reading data from this device?</p>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Keep Book</button>
        <button class="btn danger" id="btn-confirm-delete">Delete Permanently</button>
      </div>
    </div>
  `);

  $('#btn-confirm-delete').onclick = async () => {
    closeModal();
    const removedBook = { ...b };
    await removeBook(bookId);
    books = books.filter(x => x.id !== bookId);

    toast(`Removed “${b.title}”`, 'Undo', async () => {
      await put('books', removedBook);
      books.push(removedBook);
      renderHome();
      toast('Book restored.');
    });

    renderHome();
  };
}

/* Quick Book Card Menu */
function showBookQuickMenu(bookId) {
  const b = books.find(x => x.id === bookId);
  if (!b) return;

  showModal(`
    <div class="modal-header">
      <h2>${esc(b.title)}</h2>
      <button class="btn icon" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn" style="justify-content:flex-start;" onclick="closeModal();renderDetail(books.find(x=>x.id==='${bookId}'))">
        📖 Open Details &amp; Chapters
      </button>
      <button class="btn" style="justify-content:flex-start;" onclick="closeModal();showCoverStudioModal(books.find(x=>x.id==='${bookId}'))">
        🎨 Customize Cover Studio
      </button>
      <button class="btn" style="justify-content:flex-start;" onclick="closeModal();showEditBookModal(books.find(x=>x.id==='${bookId}'))">
        ✏️ Edit Title, Author &amp; Notes
      </button>
      <button class="btn" style="justify-content:flex-start;" id="menu-btn-fav">
        ${b.favorite ? '♥ Remove from Favorites' : '♡ Add to Favorites'}
      </button>
      <button class="btn" style="justify-content:flex-start;" id="menu-btn-finish">
        ${b.finished ? 'Mark as Reading' : '✓ Mark as Finished'}
      </button>
      <button class="btn danger" style="justify-content:flex-start;" onclick="closeModal();deleteBookWithPrompt('${bookId}')">
        🗑️ Delete from Device
      </button>
    </div>
  `);

  $('#menu-btn-fav').onclick = async () => {
    b.favorite = !b.favorite;
    await put('books', b);
    closeModal();
    renderHome();
    toast(b.favorite ? 'Added to favorites' : 'Removed from favorites');
  };

  $('#menu-btn-finish').onclick = async () => {
    b.finished = !b.finished;
    if (b.finished) b.progress = 100;
    await put('books', b);
    closeModal();
    renderHome();
    toast(b.finished ? 'Marked as finished!' : 'Marked as reading.');
  };
}

function downloadBlob(blob, name) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}

/* ==========================================================================
   Global Action Dispatcher & Keyboard Shortcuts
   ========================================================================== */
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;

  const act = el.dataset.action;
  const bid = el.dataset.id;

  if (act === 'home') {
    stopSpeech();
    window.onscroll = null;
    if (history.length > 1 && view !== 'home') {
      history.back();
    } else {
      renderHome();
      window.scrollTo(0, 0);
    }
  } else if (act === 'open') {
    await openBook(bid);
  } else if (act === 'detail') {
    const b = books.find(x => x.id === bid);
    if (b) await renderDetail(b);
  } else if (act === 'open-chapter') {
    await openBook(bid, Number(el.dataset.chapter));
  } else if (act === 'menu') {
    showBookQuickMenu(bid);
  }
});

// Popstate Back Button Interception
window.addEventListener('popstate', async (e) => {
  // If modal is open, closing it is the back action
  if (modal.open) {
    modalPushed = false;
    modal.close();
    return;
  }

  isNavigatingFromHistory = true;
  try {
    const state = e.state;
    if (!state || state.view === 'home') {
      stopSpeech();
      window.onscroll = null;
      renderHome();
      window.scrollTo(0, 0);

      // Root level guard: prevent accidentally closing tab on an errant back swipe
      const now = Date.now();
      if (now - lastBackPressTime > 2500) {
        lastBackPressTime = now;
        history.pushState({ view: 'home' }, '', '#library');
        toast('Press back again to exit Shelf');
      }
    } else if (state.view === 'detail' && state.bookId) {
      stopSpeech();
      window.onscroll = null;
      const b = books.find(x => x.id === state.bookId);
      if (b) await renderDetail(b);
      else renderHome();
    } else if (state.view === 'reader' && state.bookId) {
      await openBook(state.bookId, state.chapterIndex);
    } else {
      // Step one level back logically
      if (view === 'reader' && currentBook) {
        await renderDetail(currentBook);
      } else {
        renderHome();
      }
    }
  } finally {
    isNavigatingFromHistory = false;
  }
});

// File Drag & Drop
document.addEventListener('dragover', (e) => {
  e.preventDefault();
});

document.addEventListener('drop', async (e) => {
  e.preventDefault();
  if (e.dataTransfer?.files?.length) {
    await importFiles([...e.dataTransfer.files]);
  }
});

// File Input Change
$('#file-input').addEventListener('change', async (e) => {
  if (e.target.files?.length) {
    await importFiles([...e.target.files]);
    e.target.value = '';
  }
});



// Keyboard Shortcuts
document.addEventListener('keydown', (e) => {
  if (modal.open && e.key === 'Escape') {
    closeModal();
    return;
  }
  if (view === 'reader' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) {
    if (e.key === 'ArrowRight') moveChapter(1);
    if (e.key === 'ArrowLeft') moveChapter(-1);
    if (e.key.toLowerCase() === 't') showTocModal();
    if (e.key.toLowerCase() === 'f') toggleFullscreen();
  }
});

/* ==========================================================================
   Application Initialization
   ========================================================================== */
async function init() {
  try {
    if (!('indexedDB' in window)) {
      throw Error('This browser does not support IndexedDB storage.');
    }
    db = await openDB();
    await loadState();

    // Check URL hash on page load
    const hash = location.hash;
    if (hash.startsWith('#book-')) {
      const bid = hash.slice(6);
      const b = books.find(x => x.id === bid);
      if (b) await renderDetail(b);
      else renderHome();
    } else if (hash.startsWith('#reader-')) {
      const bid = hash.slice(8);
      const b = books.find(x => x.id === bid);
      if (b) await openBook(b.id);
      else renderHome();
    } else {
      history.replaceState({ view: 'home' }, '', '#library');
      history.pushState({ view: 'home' }, '', '#library');
      renderHome();
    }

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  } catch (err) {
    console.error('Init error:', err);
    $('#root').innerHTML = `
      <main class="app">
        <div class="panel empty-shelf">
          <h2>Could not start Shelf</h2>
          <p>${esc(err.message)}</p>
        </div>
      </main>
    `;
  }
}

init();
</script>
